<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>itschu.gg</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <main>
    <div class="card">
      <p class="handle">itschu.gg</p>
      <h1 class="name">itschu</h1>
      <p class="tagline">developer · maker · tinkerer</p>

      <nav class="links">
        <a href="/globe/" class="link-btn">
          <span class="link-title">Globe Viewer</span>
          <span class="link-sub">Interactive 3D WebGL globe</span>
        </a>
        <a href="https://github.com/ItsChugg" target="_blank" rel="noopener" class="link-btn">
          <span class="link-title">GitHub</span>
          <span class="link-sub">ItsChugg</span>
        </a>
      </nav>
    </div>
  </main>

  <script>
    // ── Animated star field background ────────────────────────────────────────
    const canvas = document.getElementById('bg-canvas');
    const ctx    = canvas.getContext('2d');

    const SPECTRAL = ['#a5c0ff', '#eaf0ff', '#fff8e1', '#fff0aa', '#ffb766', '#ff6030'];
    const WEIGHTS  = [0.05, 0.12, 0.20, 0.26, 0.22, 0.15];

    function spectralColor() {
      let acc = 0;
      const r = Math.random();
      for (let i = 0; i < WEIGHTS.length; i++) {
        acc += WEIGHTS[i];
        if (r < acc) return SPECTRAL[i];
      }
      return SPECTRAL[SPECTRAL.length - 1];
    }

    let stars = [];

    function initStars() {
      const w = canvas.width, h = canvas.height;
      stars = Array.from({ length: 320 }, () => ({
        x:     Math.random() * w,
        y:     Math.random() * h,
        r:     0.3 + Math.random() * 1.4,
        color: spectralColor(),
        base:  0.4 + Math.random() * 0.6,
        phase: Math.random() * Math.PI * 2,
        speed: 0.003 + Math.random() * 0.007,
      }));
    }

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    }

    window.addEventListener('resize', resize);
    resize();

    let t = 0;
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      t++;
      for (const s of stars) {
        ctx.globalAlpha = s.base * (0.7 + 0.3 * Math.sin(s.phase + t * s.speed));
        ctx.fillStyle   = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
