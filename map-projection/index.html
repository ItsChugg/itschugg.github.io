<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Projection · ItsChugg</title>
  <meta name="description" content="Change the projection of your map. Upload an equirectangular map and convert it to Mercator, Mollweide and more." />
  <meta name="theme-color" content="#4f8fd6" />
  <link rel="icon" href="/assets/icons/favicon.png?v=2" type="image/png" />
  <link rel="preload" as="image" href="/assets/backgrounds/ocean-sky-blur.jpg" />
  <link rel="stylesheet" href="/components/themes/aero.css?v=46" />
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <main class="page proj-page">
    <a class="glass back" href="/"><img src="/assets/profile_pictures/mizuiguess4-256.webp" width="26" height="26" alt="" />ItsChugg</a>

    <div class="proj-grid">

      <section class="glass pane view-pane" aria-label="Output preview">
        <div id="proj-view">
          <div id="proj-placeholder">
            <span id="placeholder-text">Upload an equirectangular map to get started</span>
          </div>
          <canvas id="output-canvas"></canvas>
        </div>
      </section>

      <section class="glass pane" id="panel" aria-labelledby="title">
        <h1 id="title">Project Projection</h1>
        <p class="lede">Upload a map, pick a new projection, and download the result.</p>

        <div class="group">
          <h2>Source Map</h2>
          <p class="hint">Your map should be equirectangular (plate carrée), which is twice as wide as it is tall.</p>
          <button class="btn" id="upload-btn" type="button">Upload Map</button>
          <div class="file-row" id="file-row">
            <span id="file-name"></span>
            <button id="clear-btn" class="clear-btn" type="button" aria-label="Remove map">✕</button>
          </div>
          <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="group">
          <h2><label for="projection-select">Output Projection</label></h2>
          <select id="projection-select">
            <option value="equirectangular">Equirectangular</option>
            <option value="mercator" selected>Mercator</option>
            <option value="mollweide">Mollweide</option>
            <option value="sinusoidal">Sinusoidal</option>
            <option value="azimuthal">Azimuthal Equidistant</option>
            <option value="orthographic">Orthographic</option>
          </select>

          <div id="center-controls">
            <div class="control-row">
              <label for="center-lat">Center Lat</label>
              <input type="range" id="center-lat" min="-90" max="90" value="0">
              <span class="val" id="center-lat-val">0°</span>
            </div>
            <div class="control-row">
              <label for="center-lon">Center Lon</label>
              <input type="range" id="center-lon" min="-180" max="180" value="0">
              <span class="val" id="center-lon-val">0°</span>
            </div>
          </div>
        </div>

        <div class="group">
          <h2>Output</h2>
          <div class="control-row">
            <label for="size-slider">Width</label>
            <input type="range" id="size-slider" min="256" max="2048" step="128" value="1024">
            <span class="val" id="size-val">1024px</span>
          </div>
          <button class="btn primary" id="process-btn" type="button" disabled>Convert</button>
          <div id="proc-progress">
            <div id="proc-bar"></div>
            <span id="proc-text">Processing…</span>
          </div>
          <button class="btn" id="download-btn" type="button" disabled>Download PNG</button>
        </div>
      </section>

    </div>
  </main>

  <script src="js/app.js?v=2"></script>
</body>
</html>
