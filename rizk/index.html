<!doctype html>
<html>
    <head>
        <meta charset="utf-8"/>
        <title>Rizk</title>
        <script>
            // Stub out the Facebook ExternalInterface bridge the SWF calls on startup.
            // Without these the Flash crashes before the splash screen renders.
            window.P3_FB_Init        = function() { return '{"status":"not_authorized"}'; };
            window.P3_FB_Login       = function() { return '{"status":"not_authorized"}'; };
            window.P3_FB_Logout      = function() { return '{}'; };
            window.P3_FB_GetStatus   = function() { return '{"status":"not_authorized"}'; };
            window.P3_FB_GetUserInfo = function() { return null; };
            window.P3_FB_PostToWall  = function() { return '{}'; };
            window.P3_FB_IsLoggedIn  = function() { return false; };
            window.p3_fb_init        = window.P3_FB_Init;
            window.p3_fb_login       = window.P3_FB_Login;
            window.p3_fb_logout      = window.P3_FB_Logout;
            window.p3_fb_getStatus   = window.P3_FB_GetStatus;

            window.RufflePlayer = window.RufflePlayer || {};
            window.RufflePlayer.config = {
                autoplay: "on",
                unmuteOverlay: "hidden",
                allowScriptAccess: true
            };
        </script>
        <script src="ruffle/ruffle.js"></script>
        <style>
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            #game {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="game"></div>
        <script>
            window.addEventListener("load", async function () {
                var ruffle = window.RufflePlayer.sources[window.RufflePlayer.newestName];
                var player = ruffle.createPlayer();
                var container = document.getElementById("game");
                container.appendChild(player);
                player.style.width  = "100%";
                player.style.height = "100%";
                await player.load({ url: "SMGame.swf", scale: "showAll" });
            });
        </script>
    </body>
</html>
