<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wiki Editor — ITSCHU.GG</title>
  <link rel="icon" href="/assets/icons/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/components/themes/theme.css?v=31" />
</head>
<body>
  <script src="/components/site-config.js?v=31"></script>
  <script src="/components/wiki-utils.js?v=31"></script>
  <script src="/components/navbar/inject-navbar.js?v=31" defer></script>

  <!-- Floating format toolbar -->
  <div class="fmt-toolbar" id="fmt-toolbar">
    <button data-cmd="bold"><strong>B</strong></button>
    <button data-cmd="italic"><em>I</em></button>
    <button data-cmd="underline"><u>U</u></button>
    <div class="fmt-sep"></div>
    <button data-cmd="link" id="fmt-link-btn">⛓</button>
    <button data-cmd="unlink" title="Remove link">✕</button>
    <div class="fmt-link-row" id="fmt-link-row">
      <input type="url" id="fmt-link-input" placeholder="https://…" />
      <button id="fmt-link-ok">↵</button>
      <button id="fmt-link-cancel">✕</button>
    </div>
  </div>

  <div class="editor-root">

    <!-- ── Left: sidebar ── -->
    <div class="editor-sidebar">
      <div class="editor-sidebar-header">
        <span id="hdr-title">EDITOR</span>
        <a class="editor-sidebar-slug" id="hdr-slug" href="#" target="_blank" title="View live page"></a>
      </div>
      <div class="editor-sidebar-body">

        <!-- CATEGORY — determines parent path automatically -->
        <div class="f-group">
          <div class="f-label">CATEGORY</div>
          <select class="f-input f-select" id="f-category">
            <option value="" disabled selected>Select category…</option>
          </select>
          <!-- Inline new-category form (hidden until + New category… is picked) -->
          <div id="new-cat-form" style="display:none;flex-direction:column;gap:5px;margin-top:6px;
               background:var(--bg);border:var(--border);padding:8px;">
            <input class="f-input" id="new-cat-name" type="text" placeholder="Category name…"
                   autocomplete="off" />
            <div style="font-family:var(--font-mono);font-size:0.68rem;color:var(--text-faint);">
              Slug: <span id="new-cat-slug-preview" style="color:var(--amber);">—</span>
            </div>
            <div style="display:flex;gap:6px;">
              <button class="btn-add" id="new-cat-confirm">CREATE</button>
              <button class="btn-add" id="new-cat-cancel"
                      style="color:var(--text-faint);">CANCEL</button>
            </div>
            <span id="new-cat-status" style="font-size:0.68rem;color:var(--text-muted);"></span>
          </div>
        </div>

        <!-- SECTIONS -->
        <div class="f-group">
          <div class="f-label">SECTIONS</div>
          <div id="sec-sidebar-list" style="display:flex;flex-direction:column;gap:5px;"></div>
          <button class="btn-add" id="sec-add" style="margin-top:4px;">+ ADD SECTION</button>
        </div>

        <!-- SEE ALSO (compact, collapsible) -->
        <div class="f-group">
          <div class="f-label collapsible-head" id="sa-head"
               style="display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;">
            <span class="collapsible-caret"
                  style="font-size:0.6rem;transition:transform 0.15s;display:inline-block;">▶</span>
            SEE ALSO
          </div>
          <div class="collapsible-body" id="sa-body"
               style="display:none;flex-direction:column;gap:5px;margin-top:6px;">
            <div id="sa-rows"></div>
            <button class="btn-add" id="sa-add">+ ADD LINK</button>
          </div>
        </div>

        <!-- MEDIA (collapsible) -->
        <div class="f-group">
          <div class="f-label collapsible-head" id="media-head"
               style="display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;">
            <span class="collapsible-caret"
                  style="font-size:0.6rem;transition:transform 0.15s;display:inline-block;">▶</span>
            MEDIA
          </div>
          <div class="collapsible-body" id="media-body"
               style="display:none;flex-direction:column;gap:6px;margin-top:6px;">
            <div style="font-size:0.68rem;color:var(--text-muted);line-height:1.5;">
              Inserts into the last active section. Images upload when you publish.
            </div>
            <input type="file" id="media-file-input" accept="image/*" multiple style="display:none;" />
            <button class="btn-add" id="media-pick-btn">+ ADD IMAGE</button>
          </div>
        </div>

      </div>
      <div class="editor-sidebar-footer">
        <a class="btn-back" id="btn-back" href="#">← BACK</a>
        <button class="btn-publish" id="btn-pub">PUBLISH</button>
        <button class="btn-danger" id="btn-del">DELETE</button>
        <span class="pub-status" id="pub-status"></span>
      </div>
    </div>

    <!-- ── Right: canvas ── -->
    <div class="editor-canvas" id="editor-canvas">
      <div class="wiki-article" id="article-canvas">
        <div class="wiki-breadcrumb" id="bc-display"><a href="/">HOME</a></div>
        <h1 id="ed-title" contenteditable="true" class="ed-field"
            spellcheck="false" data-placeholder="Article title…"></h1>
        <div id="ed-toc-render"></div>
        <div id="ed-lead" contenteditable="true" class="ed-field ed-body"
             data-placeholder="Opening summary…"></div>
        <div id="ed-sections"></div>
        <div id="ed-seealso-render"></div>
        <div id="ed-meta-render" class="wiki-meta" style="margin-top:28px;"></div>
      </div>
    </div>

  </div>

  <script>
    // ── Bootstrap ─────────────────────────────────────────────────────────────
    const REPO    = SITE.REPO;
    const session = SITE.getSession();
    if (!session) location.href = '/login/?returnTo=' + encodeURIComponent(location.pathname + location.search);
    const { slugify, esc, toB64 } = WIKI;

    const _params   = new URLSearchParams(location.search);
    const _editPath = _params.get('edit') || '';
    const wikiSlug  = _params.get('wiki') ||
                      (_editPath ? _editPath.split('/').filter(Boolean)[1] : 'evolutionary');

    document.getElementById('hdr-title').textContent = wikiSlug.toUpperCase() + ' EDITOR';

    const $ = id => document.getElementById(id);
    let uid = 0;
    const nid = () => ++uid;

    function liveVer() {
      const link = document.querySelector('link[href*="theme.css"]');
      const m = link && link.getAttribute('href').match(/\?v=(\d+)/);
      return m ? m[1] : '14';
    }

    let saRows = [];
    let activeCategory   = ''; // selected category slug — determines parent path
    let categoriesCache  = []; // [{slug, category}] from pages.json
    const pendingImages  = new Map(); // blobUrl → { file, figEl } — uploaded at publish time
    let lastFocusedBody  = null;      // last focused ed-body — target for sidebar image inserts

    const wikiRoot = 'wikipedia/' + wikiSlug;

    // ── Utilities ─────────────────────────────────────────────────────────────
    function getParent()   { return activeCategory ? wikiRoot + '/' + activeCategory : wikiRoot; }
    function getSlug()     { return slugify($('ed-title').textContent.trim() || 'untitled'); }
    function getFullPath() { const p = getParent(), s = getSlug(); return p && s ? p + '/' + s : ''; }

    function textToHtml(text) {
      if (!text) return '';
      return text.split(/\n\n+/).filter(Boolean).map(p => '<p>' + p.trim() + '</p>').join('\n');
    }

    function cleanForSave(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      div.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
      div.querySelectorAll('.ed-caption').forEach(el => el.classList.remove('ed-caption'));
      return div.innerHTML;
    }

    // ── Slug / breadcrumb sync ─────────────────────────────────────────────────
    function syncSlugDisplay() {
      const fp   = getFullPath();
      const link = $('hdr-slug');
      const url  = fp ? '/' + fp + '/' : '/wikipedia/' + wikiSlug + '/';
      link.textContent    = fp ? '/' + fp + '/' : '/wikipedia/' + wikiSlug + '/';
      link.href           = url;
      $('btn-back').href  = url;
      syncBreadcrumb();
    }

    function syncBreadcrumb() {
      const title = $('ed-title').textContent.trim() || 'Untitled';
      const parts = getParent().split('/').filter(Boolean);
      let html = '<a href="/">HOME</a>';
      let path = '';
      parts.forEach(p => {
        path += '/' + p;
        html += ' <span class="sep">//</span> <a href="' + path + '/">' + p.toUpperCase() + '</a>';
      });
      html += ' <span class="sep">//</span> ' + esc(title).toUpperCase();
      $('bc-display').innerHTML = html;
    }

    // ── Category dropdown ──────────────────────────────────────────────────────
    function buildCategoryDropdown(selected) {
      const sel = $('f-category');
      sel.innerHTML = '<option value="" disabled' + (selected ? '' : ' selected') + '>Select category…</option>';
      categoriesCache.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.slug;
        opt.textContent = cat.category;
        if (cat.slug === selected) opt.selected = true;
        sel.appendChild(opt);
      });
      const div = document.createElement('option'); div.disabled = true; div.textContent = '──────────';
      sel.appendChild(div);
      const newOpt = document.createElement('option');
      newOpt.value = '__new__'; newOpt.textContent = '+ New category…';
      sel.appendChild(newOpt);
    }

    // Load categories from pages.json
    fetch('/wikipedia/' + wikiSlug + '/pages.json')
      .then(r => r.json())
      .then(data => {
        categoriesCache = data.map(g => ({ slug: g.slug || slugify(g.category), category: g.category }));
        buildCategoryDropdown(activeCategory);
      })
      .catch(() => {
        // Fallback to common categories if pages.json not found
        categoriesCache = ['Anomalies','Biology','Elements','Magic','Sapient','Species',
                           'Technology','Unique Characters','Unique Systems']
          .map(n => ({ slug: slugify(n), category: n }));
        buildCategoryDropdown(activeCategory);
      });

    $('f-category').addEventListener('change', () => {
      const val = $('f-category').value;
      if (val === '__new__') {
        $('f-category').value = activeCategory || '';
        $('new-cat-form').style.display = 'flex';
        $('new-cat-name').focus();
        return;
      }
      activeCategory = val;
      syncSlugDisplay();
      renderCatPreview();
    });

    // ── New category form ──────────────────────────────────────────────────────
    $('new-cat-name').addEventListener('input', () => {
      $('new-cat-slug-preview').textContent = slugify($('new-cat-name').value.trim()) || '—';
    });

    $('new-cat-confirm').addEventListener('click', async () => {
      const name = $('new-cat-name').value.trim();
      const slug = slugify(name);
      if (!name || !slug) return;
      if (categoriesCache.find(c => c.slug === slug)) {
        $('new-cat-status').style.color = '#ff5555';
        $('new-cat-status').textContent = 'Category "' + slug + '" already exists.'; return;
      }
      $('new-cat-confirm').disabled = true;
      $('new-cat-status').style.color = 'var(--text-muted)';
      $('new-cat-status').textContent = 'Creating…';
      try {
        const pUrl   = 'https://api.github.com/repos/' + REPO + '/contents/wikipedia/' + wikiSlug + '/pages.json';
        const pResp  = await fetch(pUrl, { headers: authHdrs() });
        if (!pResp.ok) throw new Error('Could not read pages.json');
        const pData  = await pResp.json();
        const cur    = JSON.parse(atob(pData.content.replace(/\n/g, '')));
        await WIKI.ghPut('wikipedia/' + wikiSlug + '/pages.json',
          JSON.stringify([...cur, { slug, category: name, lead: '', pages: [] }], null, 2),
          'wiki: add "' + name + '" category');
        await WIKI.ghPut('wikipedia/' + wikiSlug + '/' + slug + '/index.html',
          WIKI.genCategoryHTML(), 'wiki: create "' + name + '" category page');
        categoriesCache.push({ slug, category: name });
        buildCategoryDropdown(slug);
        activeCategory = slug;
        $('f-category').value = slug;
        $('new-cat-name').value = ''; $('new-cat-slug-preview').textContent = '—';
        $('new-cat-status').textContent = ''; $('new-cat-form').style.display = 'none';
        syncSlugDisplay(); renderCatPreview();
      } catch(err) {
        $('new-cat-status').style.color = '#ff5555';
        $('new-cat-status').textContent = 'Error: ' + err.message;
      }
      $('new-cat-confirm').disabled = false;
    });

    $('new-cat-cancel').addEventListener('click', () => {
      $('new-cat-name').value = ''; $('new-cat-slug-preview').textContent = '—';
      $('new-cat-status').textContent = ''; $('new-cat-form').style.display = 'none';
    });

    // ── See Also collapsible ───────────────────────────────────────────────────
    {
      const head = $('sa-head'), body = $('sa-body');
      const caret = head.querySelector('.collapsible-caret');
      let open = false;
      head.addEventListener('click', () => {
        open = !open;
        body.style.display = open ? 'flex' : 'none';
        if (caret) caret.style.transform = open ? 'rotate(90deg)' : '';
      });
    }

    // ── Media sidebar ──────────────────────────────────────────────────────────
    {
      const head = $('media-head'), body = $('media-body');
      const caret = head.querySelector('.collapsible-caret');
      let open = false;
      head.addEventListener('click', () => {
        open = !open;
        body.style.display = open ? 'flex' : 'none';
        if (caret) caret.style.transform = open ? 'rotate(90deg)' : '';
      });
    }

    $('media-pick-btn').addEventListener('click', () => $('media-file-input').click());

    $('media-file-input').addEventListener('change', e => {
      const files = [...e.target.files].filter(f => f.type.startsWith('image/'));
      const target = lastFocusedBody || $('ed-lead');
      files.forEach(file => {
        const fig = createImageFigure(file);
        insertFigureIntoBody(fig, Infinity, target); // Infinity → always appends to end
      });
      e.target.value = ''; // reset so same file can be re-picked
    });

    // ── See Also sidebar (compact) ─────────────────────────────────────────────
    $('sa-add').addEventListener('click', () => { saRows.push({id:nid(),url:'',label:'',desc:''}); renderSA(); });

    function renderSA() {
      const el = $('sa-rows'); el.innerHTML = '';
      const s = 'background:none;border:none;border-bottom:1px solid var(--amber-faint);' +
                'color:var(--text);font-family:var(--font-mono);font-size:0.72rem;padding:2px 4px;outline:none;';
      saRows.forEach(r => {
        const d = document.createElement('div');
        d.style.cssText = 'background:var(--bg);border:var(--border);padding:6px;display:flex;flex-direction:column;gap:3px;';
        d.innerHTML =
          '<div style="display:flex;gap:4px;align-items:center;">' +
            '<input placeholder="Label" value="' + esc(r.label) + '" data-id="' + r.id + '" data-f="label" style="flex:1;' + s + '" />' +
            '<button class="btn-remove" data-id="' + r.id + '">✕</button>' +
          '</div>' +
          '<div style="display:flex;gap:4px;">' +
            '<input placeholder="/url/" value="' + esc(r.url) + '" data-id="' + r.id + '" data-f="url" style="flex:0 0 90px;' + s + '" />' +
            '<input placeholder="Description…" value="' + esc(r.desc) + '" data-id="' + r.id + '" data-f="desc" style="flex:1;' + s + '" />' +
          '</div>';
        el.appendChild(d);
        d.querySelectorAll('input[data-f]').forEach(i => i.addEventListener('input', e => {
          const row = saRows.find(x => x.id === +e.target.dataset.id);
          if (row) row[e.target.dataset.f] = e.target.value;
          renderSeeAlsoPreview();
        }));
        d.querySelector('.btn-remove').addEventListener('click', e => {
          saRows = saRows.filter(x => x.id !== +e.target.dataset.id);
          renderSA(); renderSeeAlsoPreview();
        });
      });
      renderSeeAlsoPreview();
    }

    // ── Section management ─────────────────────────────────────────────────────
    $('sec-add').addEventListener('click', () => {
      const sec = addSection('', '<p></p>');
      sec.querySelector('h2').focus();
    });

    function addSection(heading, html) {
      const sectionsEl = $('ed-sections');
      const div = document.createElement('div');
      div.className = 'ed-section';
      div.innerHTML =
        '<hr class="wiki-rule">' +
        '<section>' +
          '<h2 class="ed-field ed-heading" contenteditable="true" spellcheck="false" data-placeholder="Section heading…">' +
            (heading || '') +
          '</h2>' +
          '<div class="ed-field ed-body" contenteditable="true" data-placeholder="Section body…">' +
            (html || '<p></p>') +
          '</div>' +
        '</section>';

      const h2   = div.querySelector('h2');
      const body = div.querySelector('.ed-body');

      // Heading: update sidebar list + TOC on every keystroke
      h2.addEventListener('input', () => { renderSectionList(); renderTocPreview(); });
      // Heading: Enter jumps to body
      h2.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          body.focus();
          placeCaretAt(body, true);
        }
      });
      h2.addEventListener('paste', onPastePlainText);

      body.addEventListener('paste', onPasteSanitized);
      wireDropTarget(body);

      // Wire any figures that were injected via HTML (backward compat / load)
      body.querySelectorAll('figure').forEach(fig => {
        fig.contentEditable = 'false';
        wireFigureClick(fig);
      });

      sectionsEl.appendChild(div);
      renderSectionList();
      renderTocPreview();
      return div;
    }

    function renderSectionList() {
      const listEl = $('sec-sidebar-list');
      listEl.innerHTML = '';
      const secs = [...document.querySelectorAll('.ed-section')];
      secs.forEach((sec, i) => {
        const heading = sec.querySelector('h2')?.textContent.trim() || '(untitled)';
        const item = document.createElement('div');
        item.className = 'sec-list-item';
        item.innerHTML =
          '<span class="sec-list-name" title="' + esc(heading) + '">' + esc(heading) + '</span>' +
          '<button class="sec-list-btn" data-a="up" title="Move up">↑</button>' +
          '<button class="sec-list-btn" data-a="dn" title="Move down">↓</button>' +
          '<button class="sec-list-btn del" data-a="rm" title="Remove">✕</button>';

        item.querySelector('[data-a="up"]').addEventListener('click', () => {
          if (sec.previousElementSibling) { sec.parentNode.insertBefore(sec, sec.previousElementSibling); renderSectionList(); renderTocPreview(); }
        });
        item.querySelector('[data-a="dn"]').addEventListener('click', () => {
          if (sec.nextElementSibling) { sec.parentNode.insertBefore(sec.nextElementSibling, sec); renderSectionList(); renderTocPreview(); }
        });
        item.querySelector('[data-a="rm"]').addEventListener('click', () => {
          if (!confirm('Remove section "' + heading + '"?')) return;
          sec.remove(); renderSectionList(); renderTocPreview();
        });
        item.querySelector('.sec-list-name').addEventListener('click', () => {
          sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        listEl.appendChild(item);
      });
    }

    // ── Canvas: read-only preview renders ──────────────────────────────────────
    function renderTocPreview() {
      const el = $('ed-toc-render');
      const hs = [...document.querySelectorAll('.ed-section h2')]
                   .map(h => h.textContent.trim()).filter(Boolean);
      if (hs.length <= 1) { el.innerHTML = ''; return; }
      el.innerHTML =
        '<div class="wiki-toc">' +
          '<div class="wiki-toc-title">Contents</div>' +
          '<ol>' + hs.map(h => '<li><a href="#' + slugify(h) + '">' + esc(h) + '</a></li>').join('') + '</ol>' +
        '</div>';
    }

    function renderSeeAlsoPreview() {
      const el = $('ed-seealso-render');
      const valid = saRows.filter(r => r.label);
      if (!valid.length) { el.innerHTML = ''; return; }
      el.innerHTML =
        '<div class="wiki-seealso">' +
          '<div class="wiki-seealso-title">See Also</div>' +
          '<ul>' +
            valid.map(r => '<li><a href="' + esc(r.url || '#') + '">' + esc(r.label) + '</a>' +
              (r.desc ? ' — ' + esc(r.desc) : '') + '</li>').join('') +
          '</ul>' +
        '</div>';
    }

    function renderCatPreview() {
      const el = $('ed-meta-render');
      if (!activeCategory) { el.innerHTML = ''; return; }
      const entry = categoriesCache.find(c => c.slug === activeCategory);
      const name  = entry ? entry.category : activeCategory;
      el.innerHTML =
        '<div class="wiki-meta-categories"><span class="wiki-meta-label">Category</span>' +
          '<a class="wiki-cat-tag" href="/wikipedia/' + wikiSlug + '/' + activeCategory + '/">' +
            esc(name) + '</a>' +
        '</div>';
    }

    // ── Title events ───────────────────────────────────────────────────────────
    $('ed-title').addEventListener('input', () => {
      syncSlugDisplay(); // slug is always auto-derived from title
    });
    $('ed-title').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        $('ed-lead').focus();
        placeCaretAt($('ed-lead'), true);
      }
    });
    $('ed-title').addEventListener('paste', onPastePlainText);
    $('ed-lead').addEventListener('paste', onPasteSanitized);
    wireDropTarget($('ed-lead'));

    // ── Floating toolbar ───────────────────────────────────────────────────────
    const fmtBar = $('fmt-toolbar');
    let savedLinkRange = null;
    let linkModeActive = false;

    // Prevent toolbar clicks from stealing focus (except the link input)
    fmtBar.addEventListener('mousedown', e => {
      if (e.target.tagName !== 'INPUT') e.preventDefault();
    });

    document.addEventListener('selectionchange', () => {
      if (linkModeActive) return;
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.toString().trim()) {
        fmtBar.style.display = 'none';
        return;
      }
      const range = sel.getRangeAt(0);
      const node  = range.commonAncestorContainer;
      const el    = node.nodeType === 3 ? node.parentElement : node;
      if (!el || !el.closest('.ed-field')) { fmtBar.style.display = 'none'; return; }
      positionToolbar(range);
      fmtBar.style.display = 'flex';
      updateToolbarState();
    });

    // Hide toolbar on canvas scroll
    $('editor-canvas').addEventListener('scroll', () => {
      if (!linkModeActive) fmtBar.style.display = 'none';
    });

    // Track last focused body field for sidebar image insertion
    $('editor-canvas').addEventListener('focusin', e => {
      if (e.target.classList.contains('ed-body')) lastFocusedBody = e.target;
    });

    function positionToolbar(range) {
      const rect = range.getBoundingClientRect();
      const tbW  = fmtBar.offsetWidth  || 230;
      const tbH  = fmtBar.offsetHeight || 34;
      let left   = rect.left + rect.width / 2 - tbW / 2;
      left = Math.max(8, Math.min(left, window.innerWidth - tbW - 8));
      let top    = rect.top - tbH - 8;
      if (top < 60) top = rect.bottom + 8; // flip below navbar if too close to top
      fmtBar.style.left = left + 'px';
      fmtBar.style.top  = top  + 'px';
    }

    function updateToolbarState() {
      ['bold','italic','underline'].forEach(cmd => {
        const btn = fmtBar.querySelector('[data-cmd="' + cmd + '"]');
        if (btn) btn.classList.toggle('active', !!document.queryCommandState(cmd));
      });
    }

    fmtBar.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('mousedown', e => {
        e.preventDefault();
        const cmd = btn.dataset.cmd;
        if (cmd === 'link') {
          const sel = window.getSelection();
          if (sel && sel.rangeCount) savedLinkRange = sel.getRangeAt(0).cloneRange();
          linkModeActive = true;
          $('fmt-link-row').classList.add('open');
          // Pre-fill with existing href if cursor is inside a link
          const anchor = sel?.getRangeAt(0)?.commonAncestorContainer;
          const a = anchor?.nodeType === 3
            ? anchor.parentElement.closest('a')
            : anchor?.closest?.('a');
          $('fmt-link-input').value = a ? a.href : '';
          setTimeout(() => $('fmt-link-input').focus(), 0);
        } else if (cmd === 'unlink') {
          document.execCommand('unlink', false, null);
          fmtBar.style.display = 'none';
        } else {
          document.execCommand(cmd, false, null);
          updateToolbarState();
        }
      });
    });

    $('fmt-link-ok').addEventListener('click', applyLink);
    $('fmt-link-input').addEventListener('keydown', e => {
      if (e.key === 'Enter')  { e.preventDefault(); applyLink();     }
      if (e.key === 'Escape') { e.preventDefault(); closeLinkMode(); }
    });
    $('fmt-link-cancel').addEventListener('click', closeLinkMode);

    // ── Keyboard shortcuts (Ctrl/⌘ + B / I / U / K) ──────────────────────────
    document.addEventListener('keydown', e => {
      if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
      const key = e.key.toLowerCase();
      if (!['b','i','u','k'].includes(key)) return;

      // Only fire when cursor is inside an editable region
      const sel  = window.getSelection();
      if (!sel || !sel.rangeCount) return;
      const node = sel.getRangeAt(0).commonAncestorContainer;
      const el   = node.nodeType === 3 ? node.parentElement : node;
      if (!el || !el.closest('.ed-field')) return;

      e.preventDefault();
      if (key === 'b') { document.execCommand('bold',      false, null); updateToolbarState(); }
      if (key === 'i') { document.execCommand('italic',    false, null); updateToolbarState(); }
      if (key === 'u') { document.execCommand('underline', false, null); updateToolbarState(); }
      if (key === 'k') {
        // Ctrl+K — open link toolbar (only when text is selected)
        if (!sel.isCollapsed && sel.toString().trim()) {
          savedLinkRange = sel.getRangeAt(0).cloneRange();
          linkModeActive = true;
          $('fmt-link-row').classList.add('open');
          positionToolbar(sel.getRangeAt(0));
          fmtBar.style.display = 'flex';
          setTimeout(() => $('fmt-link-input').focus(), 0);
        }
      }
    });

    function applyLink() {
      const url = $('fmt-link-input').value.trim();
      if (url && savedLinkRange) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedLinkRange);
        document.execCommand('createLink', false, url);
      }
      closeLinkMode();
    }

    function closeLinkMode() {
      linkModeActive = false;
      $('fmt-link-row').classList.remove('open');
      $('fmt-link-input').value = '';
      savedLinkRange = null;
      fmtBar.style.display = 'none';
    }

    // ── Paste handlers ─────────────────────────────────────────────────────────
    function onPastePlainText(e) {
      e.preventDefault();
      document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
    }

    function onPasteSanitized(e) {
      e.preventDefault();
      const text = e.clipboardData.getData('text/plain');
      const paras = text.split(/\n\n+/);
      if (paras.length > 1) {
        document.execCommand('insertHTML', false,
          paras.map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join(''));
      } else {
        document.execCommand('insertText', false, text);
      }
    }

    // ── Image drag-and-drop ────────────────────────────────────────────────────
    function wireDropTarget(bodyEl) {
      bodyEl.addEventListener('dragover', e => {
        if ([...e.dataTransfer.types].includes('Files')) {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'copy';
          bodyEl.classList.add('drag-over');
        }
      });
      bodyEl.addEventListener('dragleave', e => {
        if (!bodyEl.contains(e.relatedTarget)) bodyEl.classList.remove('drag-over');
      });
      bodyEl.addEventListener('drop', e => {
        const file = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
        if (!file) return;
        e.preventDefault();
        bodyEl.classList.remove('drag-over');
        lastFocusedBody = bodyEl;
        const fig = createImageFigure(file);
        insertFigureIntoBody(fig, e.clientY, bodyEl);
      });
    }

    function wireFigureClick(fig) {
      fig.addEventListener('click', e => {
        if (e.target.classList.contains('ed-caption')) return;
        e.stopPropagation();
        const toRight = fig.classList.contains('wiki-figure-left');
        fig.classList.toggle('wiki-figure-right', toRight);
        fig.classList.toggle('wiki-figure-left',  !toRight);
      });
    }

    // Insert a figure as a block-level sibling (never inside a <p>), near the drop Y position.
    // Appending inside a <p> via caretRangeFromPoint produces invalid HTML that browsers
    // shuffle around, causing the layout glitches we saw.
    function insertFigureIntoBody(fig, clientY, bodyEl) {
      // Walk direct children to find the first block whose bottom edge is below the drop point
      const siblings = [...bodyEl.children];
      let insertBefore = null;
      for (const child of siblings) {
        if (child === fig) continue;
        if (clientY < child.getBoundingClientRect().bottom) {
          insertBefore = child;
          break;
        }
      }
      if (insertBefore) {
        bodyEl.insertBefore(fig, insertBefore);
      } else {
        bodyEl.appendChild(fig);
      }
      // Ensure there's always an empty paragraph after the figure so the
      // cursor doesn't get trapped when the figure is the last child.
      const next = fig.nextElementSibling;
      if (!next || next.tagName === 'FIGURE') {
        const p = document.createElement('p');
        p.innerHTML = '<br>';
        fig.after(p);
      }
    }

    // Creates a figure from a File, registers it as pending (uploaded at publish time)
    function createImageFigure(file) {
      const blobUrl = URL.createObjectURL(file);
      const fig = document.createElement('figure');
      fig.className = 'wiki-figure wiki-figure-right';
      fig.contentEditable = 'false';
      fig.dataset.pending = 'true';
      fig.innerHTML =
        '<img src="' + blobUrl + '" alt="" style="max-width:260px;" />' +
        '<figcaption class="ed-caption" contenteditable="true"></figcaption>';
      wireFigureClick(fig);
      pendingImages.set(blobUrl, { file, figEl: fig });
      return fig;
    }

    // Revoke all blob URLs and clear the pending map (call before loadState)
    function clearPendingImages() {
      for (const [blobUrl] of pendingImages) URL.revokeObjectURL(blobUrl);
      pendingImages.clear();
    }

    // Upload every pending image; swaps blob src → real URL in the DOM
    async function uploadPendingImages(statusEl) {
      const entries = [...pendingImages];
      let i = 0;
      for (const [blobUrl, { file, figEl }] of entries) {
        i++;
        if (statusEl) statusEl.textContent = 'Uploading image ' + i + ' of ' + entries.length + '…';
        const realUrl = await uploadImage(file);
        const img = figEl.querySelector('img');
        if (img) img.src = realUrl;
        delete figEl.dataset.pending;
        URL.revokeObjectURL(blobUrl);
        pendingImages.delete(blobUrl);
      }
    }

    // ── Caret helper ──────────────────────────────────────────────────────────
    function placeCaretAt(el, atStart) {
      const range = document.createRange();
      const sel   = window.getSelection();
      const node  = el.firstChild || el;
      atStart ? range.setStart(node, 0) : range.selectNodeContents(el);
      if (!atStart) range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    }

    // ── Image upload ───────────────────────────────────────────────────────────
    async function uploadImage(file) {
      const safe   = file.name.replace(/[^a-zA-Z0-9._-]/g, '-').replace(/-+/g, '-').toLowerCase();
      const path   = 'assets/wiki/' + safe;
      const apiUrl = 'https://api.github.com/repos/' + REPO + '/contents/' + path;
      const b64    = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload  = e => res(e.target.result.split(',')[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
      let sha = null;
      try {
        const chk = await fetch(apiUrl, { headers: authHdrs() });
        if (chk.ok) sha = (await chk.json()).sha;
      } catch {}
      const body = { message: 'assets: upload ' + safe, content: b64, branch: 'main' };
      if (sha) body.sha = sha;
      const resp = await fetch(apiUrl, {
        method: 'PUT',
        headers: { ...authHdrs(), 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).message || resp.status);
      return '/' + path;
    }

    function authHdrs() {
      return { 'Authorization': 'Bearer ' + session.token, 'Accept': 'application/vnd.github+json' };
    }

    // ── State ──────────────────────────────────────────────────────────────────
    function buildState() {
      return {
        v:              2,
        parent:         getParent(),
        title:          $('ed-title').textContent.trim(),
        slug:           getSlug(),
        leadHtml:       cleanForSave($('ed-lead').innerHTML),
        sections:       [...document.querySelectorAll('.ed-section')].map(sec => ({
          h:    sec.querySelector('h2').textContent.trim(),
          html: cleanForSave(sec.querySelector('.ed-body').innerHTML),
        })),
        saRows:         saRows.map(r => ({ url: r.url, label: r.label, desc: r.desc })),
        activeCategory,
      };
    }

    function loadState(state) {
      clearPendingImages();
      $('ed-title').textContent = state.title || '';

      // Determine category slug from new or old state formats
      let catSlug = state.activeCategory || '';
      if (!catSlug && state.parent) {
        const p = state.parent.split('/').filter(Boolean);
        if (p.length >= 3) catSlug = p[2]; // wikipedia/{wiki}/{cat}
      }
      if (!catSlug && state.activeCats && state.activeCats.length) {
        const found = categoriesCache.find(c => c.category === state.activeCats[0]);
        catSlug = found ? found.slug : slugify(state.activeCats[0]);
      }
      activeCategory = catSlug;
      // Apply to dropdown (may run before pages.json fetch completes — re-applied after load)
      if ($('f-category').querySelector('option[value="' + activeCategory + '"]'))
        $('f-category').value = activeCategory;

      // Lead
      const leadEl = $('ed-lead');
      leadEl.innerHTML = state.leadHtml ? state.leadHtml : state.lead ? textToHtml(state.lead) : '';
      wireDropTarget(leadEl);
      leadEl.querySelectorAll('figure').forEach(fig => { fig.contentEditable = 'false'; wireFigureClick(fig); });

      // Sections
      $('ed-sections').innerHTML = '';
      (state.sections || []).forEach(s => {
        let html = s.html ? s.html : textToHtml(s.c || '');
        if (!s.html && s.imgs && s.imgs.length) {
          html = s.imgs.filter(i => i.src).map(i =>
            '<figure class="wiki-figure wiki-figure-' + (i.align || 'right') + '" contenteditable="false">' +
            '<img src="' + esc(i.src) + '" alt="' + esc(i.alt || '') + '" style="max-width:260px;" />' +
            '<figcaption class="ed-caption" contenteditable="true">' + esc(i.alt || '') + '</figcaption>' +
            '</figure>').join('') + html;
        }
        addSection(s.h || '', html);
      });

      saRows = (state.saRows || []).map(r => ({ id: nid(), url: r.url || '', label: r.label || '', desc: r.desc || '' }));
      renderSA();
      renderSeeAlsoPreview();
      renderCatPreview();
      renderTocPreview();
      syncSlugDisplay();
    }

    // ── HTML generation ────────────────────────────────────────────────────────
    function genHTML() {
      const state = buildState();
      const title = state.title || 'Untitled';

      const validSecs = state.sections.filter(s => s.h || s.html);
      const tocHtml = validSecs.length > 1
        ? '\n        <div class="wiki-toc"><div class="wiki-toc-title">Contents</div><ol>' +
            validSecs.map(s => '<li><a href="#' + slugify(s.h || 'section') + '">' + esc(s.h) + '</a></li>').join('') +
          '</ol></div>' : '';

      const secHtml = validSecs.map(s => {
        const id = slugify(s.h || 'section');
        return '\n    <hr class="wiki-rule">\n    <section><h2 id="' + id + '">' +
          esc(s.h) + ' <a class="wiki-anchor" href="#' + id + '">§</a></h2>\n' +
          s.html + '\n    <div style="clear:both;"></div></section>';
      }).join('\n');

      const saValid = state.saRows.filter(r => r.label);
      const saHtml = saValid.length
        ? '\n        <div class="wiki-seealso"><div class="wiki-seealso-title">See Also</div><ul>' +
            saValid.map(r => '<li><a href="' + esc(r.url || '#') + '">' + esc(r.label) + '</a>' +
              (r.desc ? ' — ' + esc(r.desc) : '') + '</li>').join('') +
          '</ul></div>' : '';

      const catEntry = categoriesCache.find(c => c.slug === activeCategory);
      const catName  = catEntry ? catEntry.category : activeCategory;
      const catHtml  = activeCategory
        ? '\n          <div class="wiki-meta-categories"><span class="wiki-meta-label">Category</span>' +
            '<a class="wiki-cat-tag" href="/wikipedia/' + wikiSlug + '/' + activeCategory + '/">' + esc(catName) + '</a>' +
          '</div>' : '';

      const parts = state.parent.split('/').filter(Boolean);
      let bc = '<a href="/">HOME</a>';
      let path = '';
      parts.forEach(p => { path += '/' + p; bc += ' <span class="sep">//</span> <a href="' + path + '/">' + p.toUpperCase() + '</a>'; });
      bc += ' <span class="sep">//</span> ' + esc(title).toUpperCase();

      const v = liveVer();
      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${esc(title)} — ITSCHU.GG</title>
  <link rel="icon" href="/assets/icons/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/components/themes/theme.css?v=31" />
  <script src="/components/site-config.js?v=31"><\/script>
  <script src="/components/navbar/inject-navbar.js?v=31" defer><\/script>
  <script src="/components/sidebar/inject-sidebar.js?v=31" defer><\/script>
</head>
<body>

  <div class="page-wrapper">
    <div class="wiki-layout">

      <aside id="sidebar-container" class="subpage-bar"></aside>

      <main class="wiki-article">

        <div class="wiki-breadcrumb">${bc}</div>

        <h1>${esc(title)}</h1>
${tocHtml}
        ${state.leadHtml}
${secHtml}
${saHtml}
        <div class="wiki-meta">
${catHtml}
        </div>

      </main>
    </div>
  </div>

</body>
</html>`;
    }

    // ── Publish ────────────────────────────────────────────────────────────────
    $('btn-pub').addEventListener('click', async () => {
      const btn    = $('btn-pub');
      const status = $('pub-status');
      const title  = $('ed-title').textContent.trim();
      const slug   = getSlug();

      if (!title) { status.className = 'pub-status err'; status.textContent = 'Title is required.'; return; }
      if (!slug)  { status.className = 'pub-status err'; status.textContent = 'Slug is required.';  return; }

      btn.disabled = true;
      status.className = 'pub-status';
      status.textContent = 'Publishing…';

      // WIKI.ghPut fetches a fresh SHA immediately before each PUT,
      // eliminating the stale-SHA window that caused "does not match" errors.
      const fp = getFullPath();
      try {
        // Upload any locally-held images before freezing state/HTML
        if (pendingImages.size > 0) {
          await uploadPendingImages(status);
          status.textContent = 'Publishing…';
        }
        await WIKI.ghPut(
          fp + '/editor-state.json',
          JSON.stringify(buildState(), null, 2),
          'docs: save state for "' + slug + '"'
        );
        await WIKI.ghPut(
          fp + '/index.html',
          genHTML(),
          'docs: publish "' + title + '"'
        );
        status.className = 'pub-status ok';
        status.textContent = 'Published — live in ~60s at itschu.gg/' + fp + '/';
      } catch(err) {
        status.className = 'pub-status err';
        status.textContent = 'Error: ' + err.message;
      }
      btn.disabled = false;
    });

    // ── Delete page ────────────────────────────────────────────────────────────
    $('btn-del').addEventListener('click', async () => {
      const title  = $('ed-title').textContent.trim() || 'this page';
      const slug   = getSlug();
      const status = $('pub-status');
      if (!slug) { status.className = 'pub-status err'; status.textContent = 'No page to delete.'; return; }
      if (!confirm('Permanently delete "' + title + '"?\n\nThis removes the page files. Cannot be undone.')) return;

      const btn = $('btn-del');
      btn.disabled = true; $('btn-pub').disabled = true;
      status.className = 'pub-status'; status.textContent = 'Deleting…';

      try {
        const fp = getFullPath();
        await Promise.all([
          WIKI.ghDelete(fp + '/index.html',        'docs: delete "' + title + '"'),
          WIKI.ghDelete(fp + '/editor-state.json', 'docs: delete "' + title + '" state'),
        ]);

        // Best-effort: remove from pages.json
        try {
          const pagesUrl  = 'https://api.github.com/repos/' + REPO + '/contents/wikipedia/' + wikiSlug + '/pages.json';
          const pagesResp = await fetch(pagesUrl, { headers: authHdrs() });
          if (pagesResp.ok) {
            const pd      = await pagesResp.json();
            const pages   = JSON.parse(atob(pd.content.replace(/\n/g, '')));
            const relPath = fp.replace('wikipedia/' + wikiSlug + '/', '') + '/index.html';
            const updated = pages
              .map(g => ({ ...g, pages: g.pages.filter(p => p.file !== relPath) }))
              .filter(g => g.pages.length > 0);
            await fetch(pagesUrl, {
              method: 'PUT',
              headers: { ...authHdrs(), 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: 'docs: remove "' + title + '" from index', content: toB64(JSON.stringify(updated, null, 2)), sha: pd.sha, branch: 'main' }),
            });
          }
        } catch {}

        status.className = 'pub-status ok';
        status.textContent = '"' + title + '" deleted — redirecting…';
        setTimeout(() => location.href = '/wikipedia/' + wikiSlug + '/', 2000);
      } catch(err) {
        status.className = 'pub-status err';
        status.textContent = 'Delete failed: ' + err.message;
        btn.disabled = false; $('btn-pub').disabled = false;
      }
    });

    // ── Load on ?edit= ─────────────────────────────────────────────────────────
    (async () => {
      if (!_editPath || !session) { syncSlugDisplay(); return; }
      const status = $('pub-status');
      status.className = 'pub-status'; status.textContent = 'Loading…';
      try {
        const clean  = _editPath.replace(/^\/|\/$/g, '');
        const apiUrl = 'https://api.github.com/repos/' + REPO + '/contents/' + clean + '/editor-state.json';
        const resp   = await fetch(apiUrl, { headers: authHdrs() });
        if (!resp.ok) throw new Error('No editor state found — page may have been created outside the editor.');
        const data  = await resp.json();
        const state = JSON.parse(atob(data.content.replace(/\n/g, '')));
        loadState(state);
        // Re-apply category selection after dropdown may have loaded
        if (activeCategory && $('f-category').querySelector('option[value="' + activeCategory + '"]'))
          $('f-category').value = activeCategory;
        status.className = 'pub-status ok';
        status.textContent = 'Loaded — make changes and republish.';
      } catch(err) {
        status.className = 'pub-status err';
        status.textContent = 'Load failed: ' + err.message;
      }
      syncSlugDisplay();
    })();
  </script>
</body>
</html>
