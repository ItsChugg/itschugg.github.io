<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wiki Editor — EVOLUTIONARY</title>
  <link rel="icon" href="/assets/icons/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/components/themes/theme.css?v=8" />
  <style>
    body { overflow: hidden; }

    .editor-layout {
      display: flex;
      height: calc(100vh - 48px);
    }

    /* ── Left panel ── */
    .editor-panel {
      width: 390px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-right: var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .editor-header {
      padding: 13px 18px;
      border-bottom: var(--border);
      font-family: var(--font-head);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      color: var(--amber);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .editor-header-slug {
      font-size: 0.61rem;
      letter-spacing: 0.03em;
      color: var(--text-muted);
      font-family: var(--font-mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 210px;
    }
    .editor-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Fields ── */
    .f-group { display: flex; flex-direction: column; gap: 5px; }
    .f-label {
      font-family: var(--font-head);
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }
    .f-label small { font-family: var(--font-mono); font-size: 0.61rem; letter-spacing: 0; color: var(--text-faint); }
    .f-input, .f-textarea, .f-select {
      background: var(--bg);
      border: var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 7px 10px;
      width: 100%;
      box-sizing: border-box;
      resize: vertical;
    }
    .f-input:focus, .f-textarea:focus, .f-select:focus { outline: none; border-color: var(--amber-dim); }
    .f-textarea { min-height: 72px; }
    .f-select { appearance: none; cursor: pointer; }

    /* ── Collapsible ── */
    .collapsible-head {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
    }
    .collapsible-caret { font-size: 0.6rem; transition: transform 0.15s; display: inline-block; }
    .collapsible-head.open .collapsible-caret { transform: rotate(90deg); }
    .collapsible-body { display: none; flex-direction: column; gap: 7px; margin-top: 6px; }
    .collapsible-body.open { display: flex; }

    /* ── Section items ── */
    .sec-item {
      background: var(--bg);
      border: var(--border);
      padding: 9px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .sec-item-top { display: flex; align-items: center; gap: 7px; }
    .sec-item-top input {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 1px solid var(--amber-dim);
      color: var(--amber);
      font-family: var(--font-head);
      font-size: 0.75rem;
      padding: 3px 2px;
    }
    .sec-item-top input:focus { outline: none; }
    .sec-item-top input::placeholder { color: var(--text-faint); }

    /* ── Image rows ── */
    .img-item {
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,176,0,0.10);
      padding: 7px 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .img-item-row { display: flex; gap: 5px; align-items: center; }
    .img-item-row input {
      flex: 1;
      background: var(--bg);
      border: var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.73rem;
      padding: 4px 7px;
      min-width: 0;
    }
    .img-item-row input:focus { outline: none; border-color: var(--amber-dim); }
    .img-align-row { display: flex; gap: 5px; }
    .align-btn {
      flex: 1;
      background: none;
      border: var(--border);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 4px 0;
      cursor: pointer;
      transition: all 0.12s;
    }
    .align-btn.on { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-faint); }
    .btn-upload {
      background: none;
      border: var(--border);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 4px 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.12s, border-color 0.12s;
    }
    .btn-upload:hover:not(:disabled) { color: var(--amber); border-color: var(--amber-dim); }
    .btn-upload:disabled { opacity: 0.4; cursor: not-allowed; }
    .img-status { font-size: 0.67rem; color: var(--text-muted); min-height: 14px; }
    .img-status.ok  { color: var(--amber); }
    .img-status.err { color: #ff5555; }

    /* ── Infobox / see-also rows ── */
    .kv-row, .sa-row { display: flex; gap: 6px; align-items: center; }
    .kv-row input, .sa-row input {
      flex: 1;
      background: var(--bg);
      border: var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 5px 8px;
      min-width: 0;
    }
    .kv-row input:focus, .sa-row input:focus { outline: none; border-color: var(--amber-dim); }

    /* ── Style toggles ── */
    .style-btn-row { display: flex; gap: 5px; }
    .style-btn {
      flex: 1;
      background: none;
      border: var(--border);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 5px 0;
      cursor: pointer;
      transition: all 0.12s;
    }
    .style-btn.on { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-faint); }

    /* ── Misc buttons ── */
    .btn-remove {
      background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 0.82rem; padding: 0 3px; line-height: 1;
      transition: color 0.15s; flex-shrink: 0;
    }
    .btn-remove:hover { color: #ff5555; }
    .btn-add {
      align-self: flex-start;
      background: none; border: var(--border);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 4px 11px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-add:hover { color: var(--amber); border-color: var(--amber-dim); }

    /* ── Parent presets ── */
    .parent-presets { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .preset-btn {
      background: none;
      border: var(--border);
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 3px 8px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
      white-space: nowrap;
    }
    .preset-btn:hover { color: var(--amber); border-color: var(--amber-dim); }
    .preset-btn.on    { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-faint); }

    /* ── Categories ── */
    .cat-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .cat-btn {
      background: none; border: var(--border);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .cat-btn.on { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-faint); }

    /* ── Footer ── */
    .editor-footer {
      padding: 11px 18px;
      border-top: var(--border);
      display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
      background: var(--bg-panel);
    }
    .btn-publish {
      background: none; border: var(--border);
      color: var(--amber);
      font-family: var(--font-head);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      padding: 8px 20px;
      cursor: pointer;
      transition: box-shadow 0.15s, background 0.15s;
    }
    .btn-publish:hover:not(:disabled) { box-shadow: var(--glow-sm); background: var(--amber-faint); }
    .btn-publish:disabled { opacity: 0.35; cursor: not-allowed; }
    .pub-status { font-size: 0.72rem; color: var(--text-muted); flex: 1; }
    .pub-status.ok  { color: var(--amber); }
    .pub-status.err { color: #ff5555; }

    /* ── Preview ── */
    .preview-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .preview-header {
      padding: 11px 18px; border-bottom: var(--border);
      font-family: var(--font-head);
      font-size: 0.65rem; letter-spacing: 0.12em;
      color: var(--text-muted);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .preview-url { font-family: var(--font-mono); font-size: 0.61rem; color: var(--text-faint); }
    .preview-frame { flex: 1; border: none; background: var(--bg); width: 100%; }
  </style>
</head>
<body>
  <script src="/components/navbar/inject-navbar.js" defer></script>

  <div class="editor-layout">

    <!-- ── Left: form ── -->
    <div class="editor-panel">
      <div class="editor-header">
        <span>> WIKI EDITOR</span>
        <span class="editor-header-slug" id="hdr-slug"></span>
      </div>

      <div class="editor-body">

        <div class="f-group">
          <div class="f-label">PARENT PATH <small>(repo-relative, no leading slash)</small></div>
          <input class="f-input" id="f-parent" type="text" value="wikipedia" autocomplete="off" spellcheck="false" />
          <div class="parent-presets" id="parent-presets"></div>
        </div>

        <div class="f-group">
          <div class="f-label">TITLE</div>
          <input class="f-input" id="f-title" type="text" placeholder="Article title…" autocomplete="off" />
        </div>

        <div class="f-group">
          <div class="f-label">SLUG <small>(spaces become dashes automatically)</small></div>
          <input class="f-input" id="f-slug" type="text" placeholder="article-slug" autocomplete="off" />
        </div>

        <div class="f-group">
          <div class="f-label">LEAD PARAGRAPH</div>
          <textarea class="f-textarea" id="f-lead" placeholder="Opening summary…" style="min-height:78px;"></textarea>
        </div>

        <div class="f-group">
          <div class="f-label collapsible-head" id="ib-head">
            <span class="collapsible-caret">▶</span> INFOBOX
          </div>
          <div class="collapsible-body" id="ib-body">
            <div id="ib-rows"></div>
            <button class="btn-add" id="ib-add">+ ADD ROW</button>
          </div>
        </div>

        <div class="f-group">
          <div class="f-label">SECTIONS</div>
          <div id="sec-list" style="display:flex;flex-direction:column;gap:8px;"></div>
          <button class="btn-add" id="sec-add">+ ADD SECTION</button>
        </div>

        <div class="f-group">
          <div class="f-label collapsible-head" id="sa-head">
            <span class="collapsible-caret">▶</span> SEE ALSO
          </div>
          <div class="collapsible-body" id="sa-body">
            <div id="sa-rows"></div>
            <button class="btn-add" id="sa-add">+ ADD LINK</button>
          </div>
        </div>

        <div class="f-group">
          <div class="f-label">CATEGORIES</div>
          <div class="cat-grid" id="cat-grid"></div>
        </div>

        <div class="f-group">
          <div class="f-label collapsible-head" id="ps-head">
            <span class="collapsible-caret">▶</span> PAGE STYLE
          </div>
          <div class="collapsible-body" id="ps-body">
            <div class="f-label">BODY TEXT SIZE</div>
            <div class="style-btn-row">
              <button class="style-btn" id="bs-sm">SMALL</button>
              <button class="style-btn on" id="bs-md">MEDIUM</button>
              <button class="style-btn" id="bs-lg">LARGE</button>
            </div>
            <div class="f-label" style="margin-top:6px;">HEADING SIZE</div>
            <div class="style-btn-row">
              <button class="style-btn" id="hs-sm">COMPACT</button>
              <button class="style-btn on" id="hs-md">NORMAL</button>
              <button class="style-btn" id="hs-lg">LARGE</button>
            </div>
          </div>
        </div>

      </div>

      <div class="editor-footer">
        <button class="btn-publish" id="btn-pub">PUBLISH</button>
        <span class="pub-status" id="pub-status"></span>
      </div>
    </div>

    <!-- ── Right: preview ── -->
    <div class="preview-panel">
      <div class="preview-header">
        <span>LIVE PREVIEW</span>
        <span class="preview-url" id="prev-url"></span>
      </div>
      <iframe class="preview-frame" id="prev-frame" sandbox="allow-same-origin"></iframe>
    </div>

  </div>

  <script>
    const REPO      = 'ItsChugg/itschugg.github.io';
    const CATS      = ['Anomalies','Biology','Elements','Magic','Sapient','Species','Technology','Unique Characters','Unique Systems'];

    function getSession() {
      try {
        const s = JSON.parse(localStorage.getItem('wiki_session') || 'null');
        if (!s || Date.now() > s.expires) return null;
        return s;
      } catch { return null; }
    }
    const session = getSession();
    if (!session) location.href = '/login/?returnTo=' + encodeURIComponent(location.pathname);

    const $   = id => document.getElementById(id);
    let uid   = 0;
    const nid = () => ++uid;
    function slugify(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
    function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function toB64(s) { return btoa(unescape(encodeURIComponent(s))); }

    let sections = [], ibRows = [], saRows = [], activeCats = new Set();
    let bodySize = 'md', headScale = 'md', slugLocked = false;

    // ── Parent presets ────────────────────────────────────────────────────────
    const PRESETS = [
      'wikipedia',
      'wikipedia/anomalies',
      'wikipedia/elements',
      'wikipedia/magic',
      'wikipedia/species',
      'wikipedia/technology',
      'wikipedia/systems',
      'wikipedia/characters',
    ];

    function syncPresetHighlight() {
      const val = $('f-parent').value.trim();
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('on', b.dataset.path === val));
    }

    PRESETS.forEach(p => {
      const b = document.createElement('button');
      b.className = 'preset-btn';
      b.dataset.path = p;
      // Show only the last segment (or "root") as the label
      const parts = p.split('/');
      b.textContent = parts.length <= 2 ? 'root' : parts[parts.length - 1];
      b.title = p;
      b.addEventListener('click', () => {
        $('f-parent').value = p;
        syncPresetHighlight();
        syncSlugDisplay(); dp();
      });
      $('parent-presets').appendChild(b);
    });

    // ── Parent / title / slug ─────────────────────────────────────────────────
    $('f-parent').addEventListener('input', () => {
      // Strip leading slash as the user types
      const v = $('f-parent').value;
      if (v.startsWith('/')) $('f-parent').value = v.replace(/^\/+/, '');
      syncPresetHighlight(); syncSlugDisplay(); dp();
    });
    $('f-title').addEventListener('input', () => {
      if (!slugLocked) $('f-slug').value = slugify($('f-title').value);
      syncSlugDisplay(); dp();
    });
    $('f-slug').addEventListener('input', () => {
      const raw = $('f-slug').value, clean = raw.replace(/ /g,'-');
      if (clean !== raw) $('f-slug').value = clean;
      slugLocked = !!$('f-slug').value;
      syncSlugDisplay(); dp();
    });
    $('f-lead').addEventListener('input', dp);

    function getParent()   { return $('f-parent').value.trim().replace(/\/+$/, ''); }
    function getSlug()     { return $('f-slug').value || slugify($('f-title').value); }
    function getFullPath() { return getParent() + '/' + getSlug(); }

    function syncSlugDisplay() {
      const fp = getFullPath();
      $('hdr-slug').textContent = fp ? '/'+fp+'/' : '';
      $('prev-url').textContent = fp ? 'itschu.gg/'+fp+'/' : '';
    }

    function buildBreadcrumb(title) {
      const parts = getParent().split('/').filter(Boolean);
      let html = '<a href="/">HOME</a>';
      let path = '';
      parts.forEach(p => {
        path += '/'+p;
        html += `\n          <span class="sep">//</span>\n          <a href="${path}/">${p.toUpperCase()}</a>`;
      });
      html += `\n          <span class="sep">//</span>\n          ${esc(title).toUpperCase()}`;
      return html;
    }

    // ── Categories ───────────────────────────────────────────────────────────
    CATS.forEach(c => {
      const b = document.createElement('button');
      b.className = 'cat-btn'; b.textContent = c;
      b.addEventListener('click', () => {
        activeCats.has(c) ? (activeCats.delete(c), b.classList.remove('on'))
                          : (activeCats.add(c),    b.classList.add('on'));
        dp();
      });
      $('cat-grid').appendChild(b);
    });

    // ── Collapsibles ─────────────────────────────────────────────────────────
    ['ib','sa','ps'].forEach(id => {
      $(id+'-head').addEventListener('click', () => {
        $(id+'-head').classList.toggle('open');
        $(id+'-body').classList.toggle('open');
      });
    });

    // ── Page style ────────────────────────────────────────────────────────────
    ['sm','md','lg'].forEach(v => {
      $('bs-'+v).addEventListener('click', () => {
        bodySize = v;
        ['sm','md','lg'].forEach(x => $('bs-'+x).classList.toggle('on', x===v));
        dp();
      });
      $('hs-'+v).addEventListener('click', () => {
        headScale = v;
        ['sm','md','lg'].forEach(x => $('hs-'+x).classList.toggle('on', x===v));
        dp();
      });
    });

    // ── Infobox ──────────────────────────────────────────────────────────────
    $('ib-add').addEventListener('click', () => { ibRows.push({id:nid(),k:'',v:''}); renderIB(); dp(); });
    function renderIB() {
      const el = $('ib-rows'); el.innerHTML = '';
      ibRows.forEach(r => {
        const d = document.createElement('div'); d.className = 'kv-row';
        d.innerHTML = `<input placeholder="Property" value="${esc(r.k)}" data-id="${r.id}" data-f="k"/>
                       <input placeholder="Value"    value="${esc(r.v)}" data-id="${r.id}" data-f="v"/>
                       <button class="btn-remove" data-id="${r.id}">✕</button>`;
        el.appendChild(d);
        d.querySelectorAll('input').forEach(i => i.addEventListener('input', e => {
          const row = ibRows.find(x => x.id===+e.target.dataset.id);
          if (row) row[e.target.dataset.f] = e.target.value; dp();
        }));
        d.querySelector('.btn-remove').addEventListener('click', e => {
          ibRows = ibRows.filter(x => x.id!==+e.target.dataset.id); renderIB(); dp();
        });
      });
    }

    // ── Sections ─────────────────────────────────────────────────────────────
    $('sec-add').addEventListener('click', () => {
      sections.push({id:nid(),h:'',c:'',imgs:[]}); renderSec(); dp();
    });

    function renderSec() {
      const el = $('sec-list'); el.innerHTML = '';
      sections.forEach(s => {
        const d = document.createElement('div'); d.className = 'sec-item';
        d.innerHTML = `
          <div class="sec-item-top">
            <input type="text" placeholder="Section heading…" value="${esc(s.h)}" data-id="${s.id}" data-f="h"/>
            <button class="btn-remove" data-id="${s.id}" data-t="sec">✕</button>
          </div>
          <textarea class="f-textarea" placeholder="Body text. Blank line = new paragraph." data-id="${s.id}" data-f="c" style="min-height:62px;">${esc(s.c)}</textarea>
          <div id="simgs-${s.id}" style="display:flex;flex-direction:column;gap:5px;"></div>
          <button class="btn-add" data-sid="${s.id}" data-t="addimg">+ ADD IMAGE</button>`;
        el.appendChild(d);

        d.querySelectorAll('[data-f]').forEach(i => i.addEventListener('input', e => {
          const sec = sections.find(x => x.id===+e.target.dataset.id);
          if (sec) sec[e.target.dataset.f] = e.target.value; dp();
        }));
        d.querySelector('[data-t="sec"]').addEventListener('click', e => {
          sections = sections.filter(x => x.id!==+e.target.dataset.id); renderSec(); dp();
        });
        d.querySelector('[data-t="addimg"]').addEventListener('click', e => {
          const sec = sections.find(x => x.id===+e.target.dataset.sid);
          if (sec) { sec.imgs.push({id:nid(),src:'',alt:'',align:'right',previewSrc:''}); renderSec(); dp(); }
        });
        renderSecImgs(s);
      });
    }

    function renderSecImgs(s) {
      const container = $('simgs-'+s.id);
      if (!container) return;
      container.innerHTML = '';
      s.imgs.forEach(img => {
        const d = document.createElement('div'); d.className = 'img-item';
        d.innerHTML = `
          <div class="img-item-row">
            <input placeholder="URL or /assets/wiki/filename.png" value="${esc(img.src)}" data-imgid="${img.id}" data-f="src"/>
            <button class="btn-upload" data-imgid="${img.id}" data-sid="${s.id}">↑ UPLOAD</button>
            <input type="file" accept="image/*" style="display:none;" class="file-inp" data-imgid="${img.id}" data-sid="${s.id}"/>
            <button class="btn-remove" data-imgid="${img.id}" data-sid="${s.id}" data-t="rmimg">✕</button>
          </div>
          <div class="img-item-row">
            <input placeholder="Caption / alt text" value="${esc(img.alt)}" data-imgid="${img.id}" data-f="alt"/>
          </div>
          <div class="img-align-row">
            <button class="align-btn ${img.align==='left'?'on':''}" data-imgid="${img.id}" data-a="left">◄ LEFT</button>
            <button class="align-btn ${img.align==='right'?'on':''}" data-imgid="${img.id}" data-a="right">RIGHT ►</button>
          </div>
          <div class="img-status" id="imgst-${img.id}"></div>`;
        container.appendChild(d);

        d.querySelectorAll('input[data-f]').forEach(i => i.addEventListener('input', e => {
          const row = s.imgs.find(x => x.id===+e.target.dataset.imgid);
          if (row) row[e.target.dataset.f] = e.target.value; dp();
        }));
        d.querySelectorAll('.align-btn').forEach(b => b.addEventListener('click', e => {
          const row = s.imgs.find(x => x.id===+e.target.dataset.imgid);
          if (row) { row.align = e.target.dataset.a; renderSecImgs(s); dp(); }
        }));
        d.querySelector('[data-t="rmimg"]').addEventListener('click', e => {
          const sec = sections.find(x => x.id===+e.target.dataset.sid);
          if (sec) { sec.imgs = sec.imgs.filter(x => x.id!==+e.target.dataset.imgid); renderSecImgs(sec); dp(); }
        });

        // Upload flow
        const uploadBtn = d.querySelector('.btn-upload');
        const fileInp   = d.querySelector('.file-inp');
        uploadBtn.addEventListener('click', () => fileInp.click());
        fileInp.addEventListener('change', async () => {
          const file = fileInp.files[0];
          if (!file) return;
          const imgId    = +fileInp.dataset.imgid;
          const statusEl = $('imgst-'+imgId);
          const row      = s.imgs.find(x => x.id===imgId);

          // Show image in preview immediately via object URL
          if (row) {
            if (row.previewSrc) URL.revokeObjectURL(row.previewSrc);
            row.previewSrc = URL.createObjectURL(file);
            dp();
          }

          uploadBtn.disabled = true;
          statusEl.className = 'img-status';
          statusEl.textContent = 'Uploading…';
          try {
            const url = await uploadImage(file);
            if (row) {
              // Keep previewSrc (blob URL) alive so the preview stays visible
              // while the real GitHub URL is still deploying (~60s).
              // row.previewSrc intentionally NOT revoked here.
              row.src = url;
              renderSecImgs(s);
              dp();
            }
            const st = $('imgst-'+imgId);
            if (st) { st.className='img-status ok'; st.textContent='Uploaded → '+url+' (live in ~60s)'; }
          } catch(err) {
            statusEl.className = 'img-status err';
            statusEl.textContent = 'Upload failed: '+err.message;
            uploadBtn.disabled = false;
          }
          fileInp.value = '';
        });
      });
    }

    // ── Image upload via GitHub API ───────────────────────────────────────────
    async function uploadImage(file) {
      const safe   = file.name.replace(/[^a-zA-Z0-9._-]/g,'-').replace(/-+/g,'-').toLowerCase();
      const path   = 'assets/wiki/' + safe;
      const apiUrl = `https://api.github.com/repos/${REPO}/contents/${path}`;

      const b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload  = e => res(e.target.result.split(',')[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
      });

      let sha = null;
      try {
        const chk = await fetch(apiUrl, { headers:{'Authorization':`Bearer ${session.token}`,'Accept':'application/vnd.github+json'} });
        if (chk.ok) sha = (await chk.json()).sha;
      } catch {}

      const body = { message:`assets: upload ${safe}`, content:b64, branch:'main' };
      if (sha) body.sha = sha;

      const resp = await fetch(apiUrl, {
        method:'PUT',
        headers:{'Authorization':`Bearer ${session.token}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
        body: JSON.stringify(body),
      });
      if (!resp.ok) throw new Error((await resp.json().catch(()=>({}))).message || resp.status);
      return '/'+path;
    }

    // ── See Also ─────────────────────────────────────────────────────────────
    $('sa-add').addEventListener('click', () => { saRows.push({id:nid(),url:'',label:'',desc:''}); renderSA(); dp(); });
    function renderSA() {
      const el = $('sa-rows'); el.innerHTML = '';
      saRows.forEach(r => {
        const d = document.createElement('div'); d.className = 'sa-row';
        d.innerHTML = `
          <input placeholder="/url/" value="${esc(r.url)}" data-id="${r.id}" data-f="url" style="max-width:90px;"/>
          <input placeholder="Label" value="${esc(r.label)}" data-id="${r.id}" data-f="label"/>
          <input placeholder="Description" value="${esc(r.desc)}" data-id="${r.id}" data-f="desc"/>
          <button class="btn-remove" data-id="${r.id}">✕</button>`;
        el.appendChild(d);
        d.querySelectorAll('input').forEach(i => i.addEventListener('input', e => {
          const row = saRows.find(x => x.id===+e.target.dataset.id);
          if (row) row[e.target.dataset.f] = e.target.value; dp();
        }));
        d.querySelector('.btn-remove').addEventListener('click', e => {
          saRows = saRows.filter(x => x.id!==+e.target.dataset.id); renderSA(); dp();
        });
      });
    }

    // ── Editor state serialisation ────────────────────────────────────────────
    function buildState() {
      return {
        v: 1,
        parent:    getParent(),
        title:     $('f-title').value.trim(),
        slug:      getSlug(),
        lead:      $('f-lead').value.trim(),
        sections:  sections.map(s => ({
          h: s.h, c: s.c,
          imgs: s.imgs.map(i => ({ src: i.src, alt: i.alt, align: i.align }))
        })),
        ibRows:    ibRows.map(r => ({ k: r.k, v: r.v })),
        saRows:    saRows.map(r => ({ url: r.url, label: r.label, desc: r.desc })),
        activeCats: [...activeCats],
        bodySize,
        headScale,
      };
    }

    function loadState(state) {
      $('f-parent').value = state.parent || 'wikipedia';
      $('f-title').value  = state.title  || '';
      $('f-slug').value   = state.slug   || '';
      slugLocked = !!state.slug;
      $('f-lead').value   = state.lead   || '';

      bodySize  = state.bodySize  || 'md';
      headScale = state.headScale || 'md';
      ['sm','md','lg'].forEach(v => {
        $('bs-'+v).classList.toggle('on', v === bodySize);
        $('hs-'+v).classList.toggle('on', v === headScale);
      });

      ibRows = (state.ibRows || []).map(r => ({ id: nid(), k: r.k||'', v: r.v||'' }));
      saRows = (state.saRows || []).map(r => ({ id: nid(), url: r.url||'', label: r.label||'', desc: r.desc||'' }));
      sections = (state.sections || []).map(s => ({
        id: nid(), h: s.h||'', c: s.c||'',
        imgs: (s.imgs||[]).map(i => ({ id: nid(), src: i.src||'', alt: i.alt||'', align: i.align||'right', previewSrc: '' }))
      }));

      activeCats = new Set(state.activeCats || []);
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('on', activeCats.has(b.textContent)));

      renderIB(); renderSec(); renderSA();
      syncPresetHighlight();
      syncSlugDisplay();
      dp();
    }

    // ── HTML generation ───────────────────────────────────────────────────────
    const bodySzMap = { sm:'0.82rem', md:'0.88rem', lg:'0.96rem' };
    const headSzMap = { sm:'0.82',   md:'1',        lg:'1.18'    };

    function genHTML(forPreview = false) {
      const title = $('f-title').value.trim() || 'Untitled';
      const lead  = $('f-lead').value.trim();
      const cats  = [...activeCats];

      const styleBlock = (bodySize!=='md'||headScale!=='md') ? `
  <style>
    .wiki-article p, .wiki-article li { font-size: ${bodySzMap[bodySize]}; }
    .wiki-article h1 { font-size: calc(${headSzMap[headScale]} * 1.4rem); }
    .wiki-article h2 { font-size: calc(${headSzMap[headScale]} * 0.95rem); }
  </style>` : '';

      const ibValid = ibRows.filter(r=>r.k);
      const infoboxHtml = ibValid.length ? `
        <div class="infobox">
          <div class="infobox-title">${esc(title)}</div>
          <table>
            ${ibValid.map(r=>`<tr><td>${esc(r.k)}</td><td>${esc(r.v)}</td></tr>`).join('\n            ')}
          </table>
        </div>` : '';

      const validSecs = sections.filter(s=>s.h||s.c);
      const tocHtml = validSecs.length > 1 ? `
        <div class="wiki-toc">
          <div class="wiki-toc-title">Contents</div>
          <ol>
            ${validSecs.map(s=>`<li><a href="#${slugify(s.h||'section')}">${esc(s.h)}</a></li>`).join('\n            ')}
          </ol>
        </div>` : '';

      const secHtml = validSecs.map(s => {
        const id = slugify(s.h||'section');
        const imgHtml = s.imgs.filter(i=>i.src||i.previewSrc).map(i => {
          const dispSrc = forPreview ? (i.previewSrc || i.src) : i.src;
          return `          <figure class="wiki-figure wiki-figure-${i.align}">
            <img src="${esc(dispSrc)}" alt="${esc(i.alt)}" />
            ${i.alt?`<figcaption>${esc(i.alt)}</figcaption>`:''}`+`
          </figure>`;
        }).join('\n');
        const paras = (s.c||'').split(/\n\n+/).filter(Boolean)
          .map(p=>`          <p>${esc(p.trim())}</p>`).join('\n');
        return `
        <hr class="wiki-rule">

        <section>
          <h2 id="${id}">${esc(s.h)} <a class="wiki-anchor" href="#${id}">§</a></h2>
${imgHtml}
${paras}
          <div style="clear:both;"></div>
        </section>`;
      }).join('\n');

      const saValid = saRows.filter(r=>r.label);
      const saHtml = saValid.length ? `
        <div class="wiki-seealso">
          <div class="wiki-seealso-title">See Also</div>
          <ul>
            ${saValid.map(r=>`<li><a href="${esc(r.url||'#')}">${esc(r.label)}</a>${r.desc?' — '+esc(r.desc):''}</li>`).join('\n            ')}
          </ul>
        </div>` : '';

      const catHtml = cats.length ? `
          <div class="wiki-meta-categories">
            <span class="wiki-meta-label">Categories</span>
            ${cats.map(c=>`<a class="wiki-cat-tag" href="#">${c}</a>`).join('\n            ')}
          </div>` : '';

      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${esc(title)} — EVOLUTIONARY</title>
  <link rel="icon" href="/assets/icons/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/components/themes/theme.css?v=8" />${styleBlock}
</head>
<body>

  <div class="page-wrapper">
    <div class="wiki-layout">

      <aside id="sidebar-container" class="subpage-bar"></aside>

      <main class="wiki-article">

        <div class="wiki-breadcrumb">
          ${buildBreadcrumb(title)}
        </div>

        <h1>${esc(title)}</h1>
${infoboxHtml}${tocHtml}
        <p>${esc(lead)}</p>
${secHtml}
${saHtml}
        <div class="wiki-meta">
${catHtml}
        </div>

      </main>
    </div>
  </div>

  <script src="/components/navbar/inject-navbar.js" defer><\/script>
  <script src="/components/sidebar/inject-sidebar.js" defer><\/script>
  <script>
(function(){
  try {
    var s = JSON.parse(localStorage.getItem('wiki_session')||'null');
    if (!s || Date.now() > s.expires) return;
    var a = document.createElement('a');
    a.href = '/wikipedia/editor/?edit=' + encodeURIComponent(location.pathname);
    a.textContent = '✎ EDIT PAGE';
    a.className = 'wiki-edit-btn';
    document.body.appendChild(a);
  } catch(e) {}
})();
  <\/script>
</body>
</html>`;
    }

    // ── Live preview ──────────────────────────────────────────────────────────
    let pt = null;
    function dp() { clearTimeout(pt); pt = setTimeout(()=>{ $('prev-frame').srcdoc = genHTML(true); }, 280); }
    syncPresetHighlight();
    dp();

    // ── Publish ───────────────────────────────────────────────────────────────
    $('btn-pub').addEventListener('click', async () => {
      const btn    = $('btn-pub');
      const status = $('pub-status');
      const title  = $('f-title').value.trim();
      const slug   = getSlug();

      if (!title) { status.className='pub-status err'; status.textContent='Title is required.'; return; }
      if (!slug)  { status.className='pub-status err'; status.textContent='Slug is required.';  return; }

      btn.disabled = true;
      status.className = 'pub-status';
      status.textContent = 'Publishing…';

      const fullPath   = getFullPath();
      const htmlPath   = fullPath + '/index.html';
      const statePath  = fullPath + '/editor-state.json';
      const htmlApiUrl = `https://api.github.com/repos/${REPO}/contents/${htmlPath}`;
      const stateApiUrl= `https://api.github.com/repos/${REPO}/contents/${statePath}`;
      const html       = genHTML();
      const stateJson  = JSON.stringify(buildState(), null, 2);
      const isUpdate   = sha => sha ? `docs: update "${title}"` : `docs: add wiki page "${title}"`;

      // Fetch existing SHAs in parallel
      let htmlSha = null, stateSha = null;
      try {
        const [hChk, sChk] = await Promise.all([
          fetch(htmlApiUrl,  { headers:{'Authorization':`Bearer ${session.token}`,'Accept':'application/vnd.github+json'} }),
          fetch(stateApiUrl, { headers:{'Authorization':`Bearer ${session.token}`,'Accept':'application/vnd.github+json'} }),
        ]);
        if (hChk.ok) htmlSha  = (await hChk.json()).sha;
        if (sChk.ok) stateSha = (await sChk.json()).sha;
      } catch {}

      const htmlBody  = { message: isUpdate(htmlSha),  content: toB64(html),      branch:'main' };
      const stateBody = { message: isUpdate(stateSha), content: toB64(stateJson), branch:'main' };
      if (htmlSha)  htmlBody.sha  = htmlSha;
      if (stateSha) stateBody.sha = stateSha;

      try {
        // Write both files; state first so the edit button can always find it
        const [stResp, htmlResp] = await Promise.all([
          fetch(stateApiUrl, { method:'PUT', headers:{'Authorization':`Bearer ${session.token}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'}, body: JSON.stringify(stateBody) }),
          fetch(htmlApiUrl,  { method:'PUT', headers:{'Authorization':`Bearer ${session.token}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'}, body: JSON.stringify(htmlBody)  }),
        ]);
        if (htmlResp.ok && stResp.ok) {
          status.className = 'pub-status ok';
          status.textContent = (htmlSha?'Updated':'Published')+` — live in ~60s at itschu.gg/${fullPath}/`;
        } else {
          const errBody = await (htmlResp.ok ? stResp : htmlResp).json().catch(()=>({}));
          status.className = 'pub-status err';
          status.textContent = 'GitHub error: '+(errBody.message||'unknown');
        }
      } catch {
        status.className = 'pub-status err';
        status.textContent = 'Network error — try again.';
      }
      btn.disabled = false;
    });
    // ── Load existing page via ?edit=/path/ ───────────────────────────────────
    (async () => {
      const editPath = new URLSearchParams(location.search).get('edit');
      if (!editPath || !session) return;
      const status = $('pub-status');
      status.className = 'pub-status';
      status.textContent = 'Loading page…';
      try {
        const clean  = editPath.replace(/^\/|\/$/g, '');
        const apiUrl = `https://api.github.com/repos/${REPO}/contents/${clean}/editor-state.json`;
        const resp   = await fetch(apiUrl, {
          headers: { 'Authorization': `Bearer ${session.token}`, 'Accept': 'application/vnd.github+json' }
        });
        if (!resp.ok) throw new Error('No editor state found — page may have been created outside the editor.');
        const data  = await resp.json();
        const state = JSON.parse(atob(data.content.replace(/\n/g, '')));
        loadState(state);
        status.className = 'pub-status ok';
        status.textContent = 'Page loaded — make your changes and republish.';
      } catch(err) {
        status.className = 'pub-status err';
        status.textContent = 'Load failed: ' + err.message;
      }
    })();
  </script>
</body>
</html>
