<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hub Editor — ITSCHU.GG</title>
  <link rel="icon" href="/assets/icons/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/components/themes/theme.css?v=22" />
</head>
<body>
  <script src="/components/site-config.js?v=22"></script>
  <script src="/components/wiki-utils.js?v=22"></script>
  <script src="/components/navbar/inject-navbar.js?v=22" defer></script>

  <!-- Floating format toolbar -->
  <div class="fmt-toolbar" id="fmt-toolbar">
    <button data-cmd="bold"><strong>B</strong></button>
    <button data-cmd="italic"><em>I</em></button>
    <button data-cmd="underline"><u>U</u></button>
    <div class="fmt-sep"></div>
    <button data-cmd="link" id="fmt-link-btn">⛓</button>
    <button data-cmd="unlink" title="Remove link">✕</button>
    <div class="fmt-link-row" id="fmt-link-row">
      <input type="url" id="fmt-link-input" placeholder="https://…" />
      <button id="fmt-link-ok">↵</button>
      <button id="fmt-link-cancel">✕</button>
    </div>
  </div>

  <div class="editor-root">

    <!-- ── Left: sidebar ── -->
    <div class="editor-sidebar">
      <div class="editor-sidebar-header">
        <span>HUB EDITOR</span>
        <a class="editor-sidebar-slug" id="hdr-slug" href="#" target="_blank" title="View live wiki hub"></a>
      </div>
      <div class="editor-sidebar-body">

        <div class="f-group">
          <div class="f-label">WIKI SLUG</div>
          <div style="display:flex;gap:6px;">
            <input class="f-input" id="f-wiki" type="text" placeholder="e.g. evolutionary"
                   autocomplete="off" spellcheck="false" style="flex:1;" />
            <button class="btn-add" id="btn-load" style="padding:7px 12px;white-space:nowrap;">LOAD</button>
          </div>
        </div>

        <div class="f-group">
          <div class="f-label">FEATURED ARTICLES
            <small style="font-family:var(--font-mono);font-size:0.60rem;letter-spacing:0;color:var(--text-faint);">(stats auto-count from pages)</small>
          </div>
          <div id="feat-list" style="display:flex;flex-direction:column;gap:8px;"></div>
          <button class="btn-add" id="feat-add" style="margin-top:4px;">+ ADD FEATURED ARTICLE</button>
        </div>

        <div class="f-group">
          <div class="f-label">FOOTER NOTE</div>
          <input class="f-input" id="f-footer" type="text"
                 placeholder="e.g. This wiki is under active development." />
        </div>

      </div>
      <div class="editor-sidebar-footer">
        <a class="btn-back" id="btn-back" href="/wikipedia/">← BACK</a>
        <button class="btn-publish" id="btn-pub">PUBLISH</button>
        <button class="btn-danger"  id="btn-del-wiki">DELETE WIKI</button>
        <span class="pub-status" id="pub-status"></span>
      </div>
    </div>

    <!-- ── Right: canvas ── -->
    <div class="editor-canvas" id="editor-canvas">
      <div class="wiki-article" id="hub-canvas">

        <div class="wiki-breadcrumb">
          <a href="/">HOME</a>
          <span class="sep">//</span>
          <a href="/wikipedia/">WIKIPEDIA</a>
          <span class="sep">//</span>
          <span id="bc-wiki-name">WIKI</span>
        </div>

        <h1 id="ed-title" contenteditable="true" class="ed-field"
            spellcheck="false" data-placeholder="Wiki title…"></h1>

        <div id="ed-lead" contenteditable="true" class="ed-field ed-body"
             data-placeholder="Lead paragraphs — describe this wiki…"></div>

        <hr class="wiki-rule">

        <div class="wiki-stats wiki-stats-sm" id="ed-stats-render">
          <div class="wiki-stat"><span class="wiki-stat-num" id="stat-pages">—</span><span class="wiki-stat-label">Pages</span></div>
          <div class="wiki-stat"><span class="wiki-stat-num" id="stat-cats">—</span><span class="wiki-stat-label">Categories</span></div>
        </div>

        <div id="ed-featured-render"></div>

        <section>
          <h2>Browse by Category</h2>
          <div class="wiki-categories" id="hub-categories"></div>
        </section>

        <div class="wiki-meta">
          <div class="wiki-meta-edited" id="ed-footer-render" style="opacity:0.6;"></div>
        </div>

      </div>
    </div>

  </div>

  <script>
    // ── Bootstrap ─────────────────────────────────────────────────────────────
    const REPO    = SITE.REPO;
    const session = SITE.getSession();
    if (!session) location.href = '/login/?returnTo=' + encodeURIComponent(location.pathname + location.search);
    const { esc, toB64 } = WIKI;

    const $ = id => document.getElementById(id);
    let uid = 0;
    const nid = () => ++uid;

    let featuredItems = [{ id: nid(), title: '', link: '', excerpt: '' }];

    function authHdrs() {
      return { 'Authorization': 'Bearer ' + session.token, 'Accept': 'application/vnd.github+json' };
    }

    // ── Slug display sync ──────────────────────────────────────────────────────
    function syncSlugDisplay() {
      const slug = $('f-wiki').value.trim();
      const link = $('hdr-slug');
      const url  = slug ? '/wikipedia/' + slug + '/' : '/wikipedia/';
      link.textContent              = slug ? '/wikipedia/' + slug + '/' : '';
      link.href                     = url;
      $('btn-back').href            = url;
      $('bc-wiki-name').textContent = slug ? slug.toUpperCase() : 'WIKI';
    }

    $('f-wiki').addEventListener('input', syncSlugDisplay);

    // ── Featured articles sidebar ──────────────────────────────────────────────
    $('feat-add').addEventListener('click', () => {
      featuredItems.push({ id: nid(), title: '', link: '', excerpt: '' });
      renderFeatured();
    });

    function renderFeatured() {
      const el = $('feat-list'); el.innerHTML = '';
      featuredItems.forEach(item => {
        const d = document.createElement('div');
        d.style.cssText = 'background:var(--bg);border:var(--border);padding:9px;display:flex;flex-direction:column;gap:6px;';
        d.innerHTML =
          '<div style="display:flex;align-items:center;gap:7px;">' +
            '<input type="text" placeholder="Article title…" value="' + esc(item.title) + '"' +
              ' data-id="' + item.id + '" data-f="title"' +
              ' style="flex:1;background:none;border:none;border-bottom:1px solid var(--amber-dim);' +
                      'color:var(--amber);font-family:var(--font-head);font-size:0.75rem;padding:3px 2px;outline:none;" />' +
            '<button style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.82rem;padding:0 3px;"' +
              ' data-id="' + item.id + '" data-t="rm">✕</button>' +
          '</div>' +
          '<input class="f-input" placeholder="/wikipedia/slug/article/" value="' + esc(item.link) + '"' +
            ' data-id="' + item.id + '" data-f="link" style="margin-top:2px;" />' +
          '<textarea class="f-textarea" placeholder="Short excerpt…"' +
            ' data-id="' + item.id + '" data-f="excerpt"' +
            ' style="min-height:50px;background:var(--bg);border:var(--border);color:var(--text);' +
                    'font-family:var(--font-mono);font-size:0.78rem;padding:6px 9px;width:100%;box-sizing:border-box;resize:vertical;">' +
            esc(item.excerpt) +
          '</textarea>';
        el.appendChild(d);
        d.querySelectorAll('[data-f]').forEach(i => i.addEventListener('input', e => {
          const row = featuredItems.find(x => x.id === +e.target.dataset.id);
          if (row) row[e.target.dataset.f] = e.target.value;
          renderFeaturedPreview();
        }));
        d.querySelector('[data-t="rm"]').addEventListener('click', e => {
          featuredItems = featuredItems.filter(x => x.id !== +e.target.dataset.id);
          renderFeatured(); renderFeaturedPreview();
        });
      });
      renderFeaturedPreview();
    }

    // ── Footer note ────────────────────────────────────────────────────────────
    $('f-footer').addEventListener('input', () => {
      const v = $('f-footer').value.trim();
      $('ed-footer-render').textContent = v;
    });

    // ── Canvas: read-only preview renders ──────────────────────────────────────
    function renderFeaturedPreview() {
      const el   = $('ed-featured-render');
      const valid = featuredItems.filter(f => f.title);
      el.innerHTML = valid.map(f =>
        '<div class="wiki-hub-box" style="margin-bottom:16px;">' +
          '<div class="wiki-hub-box-title">Featured — ' + esc(f.title) + '</div>' +
          '<p style="font-size:0.83rem;line-height:1.75;">' +
            '<strong><a href="' + esc(f.link || '#') + '">' + esc(f.title) + '</a></strong> ' +
            esc(f.excerpt) +
          '</p>' +
          '<p style="font-size:0.78rem;margin-top:8px;">' +
            '<a href="' + esc(f.link || '#') + '">Read full article →</a>' +
          '</p>' +
        '</div>'
      ).join('');
    }

    function loadStats(slug) {
      fetch('/wikipedia/' + slug + '/pages.json')
        .then(r => r.json())
        .then(data => {
          const pages = data.reduce((n, g) => n + g.pages.length, 0);
          $('stat-pages').textContent = pages;
          $('stat-cats').textContent  = data.length;
          // Categories
          const cats = $('hub-categories');
          cats.innerHTML = '';
          data.forEach(g => {
            const a = document.createElement('a');
            a.className = 'wiki-category-card';
            a.href      = '#';
            a.innerHTML = '<div class="cat-name">' + g.category + '</div>' +
                          '<div class="cat-count">' + g.pages.length + ' article' + (g.pages.length === 1 ? '' : 's') + '</div>';
            cats.appendChild(a);
          });
        })
        .catch(() => {});
    }

    // ── Load state ─────────────────────────────────────────────────────────────
    function loadState(state, slug) {
      $('f-wiki').value = slug;
      syncSlugDisplay();

      // Title (editable in canvas)
      $('ed-title').textContent = state.title || '';

      // Lead
      const leadEl = $('ed-lead');
      if (state.leadHtml) {
        leadEl.innerHTML = state.leadHtml;
      } else if (state.lead) {
        leadEl.innerHTML = (state.lead || '').split(/\n\n+/).filter(Boolean)
          .map(p => '<p>' + p.trim() + '</p>').join('\n');
      } else {
        leadEl.innerHTML = '';
      }

      // Featured
      const arr = Array.isArray(state.featured)
        ? state.featured
        : (state.featured?.title ? [state.featured] : []);
      featuredItems = arr.length
        ? arr.map(f => ({ id: nid(), title: f.title || '', link: f.link || '', excerpt: f.excerpt || '' }))
        : [{ id: nid(), title: '', link: '', excerpt: '' }];
      renderFeatured();

      // Footer
      $('f-footer').value = state.footerNote || '';
      $('ed-footer-render').textContent = state.footerNote || '';

      loadStats(slug);
    }

    function buildState() {
      return {
        v:         1,
        title:     $('ed-title').textContent.trim(),
        leadHtml:  cleanForSave($('ed-lead').innerHTML),
        featured:  featuredItems.map(f => ({ title: f.title, link: f.link, excerpt: f.excerpt })),
        footerNote: $('f-footer').value.trim(),
      };
    }

    function cleanForSave(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      div.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
      return div.innerHTML;
    }

    // ── Floating toolbar ───────────────────────────────────────────────────────
    const fmtBar = $('fmt-toolbar');
    let savedLinkRange = null;
    let linkModeActive = false;

    fmtBar.addEventListener('mousedown', e => {
      if (e.target.tagName !== 'INPUT') e.preventDefault();
    });

    document.addEventListener('selectionchange', () => {
      if (linkModeActive) return;
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.toString().trim()) {
        fmtBar.style.display = 'none'; return;
      }
      const range = sel.getRangeAt(0);
      const node  = range.commonAncestorContainer;
      const el    = node.nodeType === 3 ? node.parentElement : node;
      if (!el || !el.closest('.ed-field')) { fmtBar.style.display = 'none'; return; }
      positionToolbar(range);
      fmtBar.style.display = 'flex';
      updateToolbarState();
    });

    $('editor-canvas').addEventListener('scroll', () => {
      if (!linkModeActive) fmtBar.style.display = 'none';
    });

    function positionToolbar(range) {
      const rect = range.getBoundingClientRect();
      const tbW  = fmtBar.offsetWidth  || 230;
      const tbH  = fmtBar.offsetHeight || 34;
      let left   = rect.left + rect.width / 2 - tbW / 2;
      left = Math.max(8, Math.min(left, window.innerWidth - tbW - 8));
      let top    = rect.top - tbH - 8;
      if (top < 60) top = rect.bottom + 8;
      fmtBar.style.left = left + 'px';
      fmtBar.style.top  = top  + 'px';
    }

    function updateToolbarState() {
      ['bold','italic','underline'].forEach(cmd => {
        const btn = fmtBar.querySelector('[data-cmd="' + cmd + '"]');
        if (btn) btn.classList.toggle('active', !!document.queryCommandState(cmd));
      });
    }

    fmtBar.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('mousedown', e => {
        e.preventDefault();
        const cmd = btn.dataset.cmd;
        if (cmd === 'link') {
          const sel = window.getSelection();
          if (sel && sel.rangeCount) savedLinkRange = sel.getRangeAt(0).cloneRange();
          linkModeActive = true;
          $('fmt-link-row').classList.add('open');
          const anchor = sel?.getRangeAt(0)?.commonAncestorContainer;
          const a = anchor?.nodeType === 3 ? anchor.parentElement.closest('a') : anchor?.closest?.('a');
          $('fmt-link-input').value = a ? a.href : '';
          setTimeout(() => $('fmt-link-input').focus(), 0);
        } else if (cmd === 'unlink') {
          document.execCommand('unlink', false, null);
          fmtBar.style.display = 'none';
        } else {
          document.execCommand(cmd, false, null);
          updateToolbarState();
        }
      });
    });

    $('fmt-link-ok').addEventListener('click', applyLink);
    $('fmt-link-input').addEventListener('keydown', e => {
      if (e.key === 'Enter')  { e.preventDefault(); applyLink();     }
      if (e.key === 'Escape') { e.preventDefault(); closeLinkMode(); }
    });
    $('fmt-link-cancel').addEventListener('click', closeLinkMode);

    // ── Keyboard shortcuts (Ctrl/⌘ + B / I / U / K) ──────────────────────────
    document.addEventListener('keydown', e => {
      if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
      const key = e.key.toLowerCase();
      if (!['b','i','u','k'].includes(key)) return;

      const sel  = window.getSelection();
      if (!sel || !sel.rangeCount) return;
      const node = sel.getRangeAt(0).commonAncestorContainer;
      const el   = node.nodeType === 3 ? node.parentElement : node;
      if (!el || !el.closest('.ed-field')) return;

      e.preventDefault();
      if (key === 'b') { document.execCommand('bold',      false, null); updateToolbarState(); }
      if (key === 'i') { document.execCommand('italic',    false, null); updateToolbarState(); }
      if (key === 'u') { document.execCommand('underline', false, null); updateToolbarState(); }
      if (key === 'k') {
        if (!sel.isCollapsed && sel.toString().trim()) {
          savedLinkRange = sel.getRangeAt(0).cloneRange();
          linkModeActive = true;
          $('fmt-link-row').classList.add('open');
          positionToolbar(sel.getRangeAt(0));
          fmtBar.style.display = 'flex';
          setTimeout(() => $('fmt-link-input').focus(), 0);
        }
      }
    });

    function applyLink() {
      const url = $('fmt-link-input').value.trim();
      if (url && savedLinkRange) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedLinkRange);
        document.execCommand('createLink', false, url);
      }
      closeLinkMode();
    }

    function closeLinkMode() {
      linkModeActive = false;
      $('fmt-link-row').classList.remove('open');
      $('fmt-link-input').value = '';
      savedLinkRange = null;
      fmtBar.style.display = 'none';
    }

    // ── Title → breadcrumb sync ────────────────────────────────────────────────
    $('ed-title').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        $('ed-lead').focus();
      }
    });
    $('ed-title').addEventListener('paste', e => {
      e.preventDefault();
      document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
    });
    $('ed-lead').addEventListener('paste', e => {
      e.preventDefault();
      const text = e.clipboardData.getData('text/plain');
      const paras = text.split(/\n\n+/);
      if (paras.length > 1) {
        document.execCommand('insertHTML', false, paras.map(p => '<p>' + p + '</p>').join(''));
      } else {
        document.execCommand('insertText', false, text);
      }
    });

    // ── Load button ────────────────────────────────────────────────────────────
    $('btn-load').addEventListener('click', async () => {
      const slug   = $('f-wiki').value.trim();
      const status = $('pub-status');
      if (!slug) { status.className = 'pub-status err'; status.textContent = 'Enter a wiki slug.'; return; }
      status.className = 'pub-status'; status.textContent = 'Loading…';
      try {
        const api  = 'https://api.github.com/repos/' + REPO + '/contents/wikipedia/' + slug + '/hub-state.json';
        const resp = await fetch(api, { headers: authHdrs() });
        if (!resp.ok) throw new Error('No hub state found — fill in the form and publish to create one.');
        const data  = await resp.json();
        const state = JSON.parse(atob(data.content.replace(/\n/g, '')));
        loadState(state, slug);
        status.className = 'pub-status ok'; status.textContent = 'Loaded — make changes and republish.';
      } catch(err) {
        syncSlugDisplay();
        status.className = 'pub-status'; status.textContent = err.message;
      }
    });

    // ── Publish ────────────────────────────────────────────────────────────────
    $('btn-pub').addEventListener('click', async () => {
      const slug  = $('f-wiki').value.trim();
      const state = buildState();
      const btn   = $('btn-pub');
      const status = $('pub-status');

      if (!slug)        { status.className = 'pub-status err'; status.textContent = 'Wiki slug is required.'; return; }
      if (!state.title) { status.className = 'pub-status err'; status.textContent = 'Title is required.';     return; }

      btn.disabled = true;
      status.className = 'pub-status'; status.textContent = 'Publishing…';

      // WIKI.ghPut fetches a fresh SHA immediately before each PUT, so
      // there is no stale-SHA window regardless of other concurrent writes.
      try {
        await WIKI.ghPut(
          'wikipedia/' + slug + '/hub-state.json',
          JSON.stringify(state, null, 2),
          'wiki: save hub state for "' + slug + '"'
        );
        await WIKI.ghPut(
          'wikipedia/' + slug + '/index.html',
          WIKI.genHubHTML(state, slug),
          'wiki: update "' + state.title + '" hub'
        );
        status.className = 'pub-status ok';
        status.textContent = 'Published — live in ~60s at itschu.gg/wikipedia/' + slug + '/';
      } catch(err) {
        status.className = 'pub-status err';
        status.textContent = 'Error: ' + err.message;
      }
      btn.disabled = false;
    });

    // ── Delete wiki ────────────────────────────────────────────────────────────
    $('btn-del-wiki').addEventListener('click', async () => {
      const slug  = $('f-wiki').value.trim();
      const title = $('ed-title').textContent.trim() || slug;
      const status = $('pub-status');
      if (!slug) { status.className = 'pub-status err'; status.textContent = 'Enter a wiki slug first.'; return; }

      const typed = prompt(
        'This will permanently delete the "' + title + '" Wikipedia and remove it from the wiki list.\n\n' +
        'Article files will remain on disk but be inaccessible.\n\n' +
        'Type "' + slug + '" to confirm deletion:'
      );
      if (typed === null) return;
      if (typed !== slug) { alert('Slug did not match — deletion cancelled.'); return; }

      const btn = $('btn-del-wiki');
      btn.disabled = true; $('btn-pub').disabled = true;
      status.className = 'pub-status'; status.textContent = 'Deleting…';
      try {
        await Promise.all([
          WIKI.ghDelete('wikipedia/' + slug + '/index.html',     'wiki: delete "' + title + '" hub'),
          WIKI.ghDelete('wikipedia/' + slug + '/hub-state.json', 'wiki: delete "' + title + '" hub state'),
          WIKI.ghDelete('wikipedia/' + slug + '/pages.json',     'wiki: delete "' + title + '" pages'),
        ]);
        const wikisUrl  = 'https://api.github.com/repos/' + REPO + '/contents/wikipedia/wikis.json';
        const wikisResp = await fetch(wikisUrl, { headers: authHdrs() });
        if (wikisResp.ok) {
          const wd    = await wikisResp.json();
          const wikis = JSON.parse(atob(wd.content.replace(/\n/g, '')));
          const body  = {
            message: 'wiki: deregister "' + title + '"',
            content: toB64(JSON.stringify(wikis.filter(w => w.slug !== slug), null, 2)),
            sha: wd.sha, branch: 'main',
          };
          await fetch(wikisUrl, { method: 'PUT', headers: { ...authHdrs(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        }
        status.className = 'pub-status ok';
        status.textContent = '"' + title + '" deleted — redirecting…';
        setTimeout(() => location.href = '/wikipedia/', 2000);
      } catch(err) {
        status.className = 'pub-status err';
        status.textContent = 'Delete failed: ' + err.message;
        btn.disabled = false; $('btn-pub').disabled = false;
      }
    });

    // ── Auto-load on ?wiki= ────────────────────────────────────────────────────
    (async () => {
      const slug = new URLSearchParams(location.search).get('wiki');
      if (!slug || !session) return;
      $('f-wiki').value = slug;
      syncSlugDisplay();
      const status = $('pub-status');
      status.className = 'pub-status'; status.textContent = 'Loading…';
      try {
        const api  = 'https://api.github.com/repos/' + REPO + '/contents/wikipedia/' + slug + '/hub-state.json';
        const resp = await fetch(api, { headers: authHdrs() });
        if (!resp.ok) throw new Error('No hub state found — fill in the form and publish to create one.');
        const data  = await resp.json();
        const state = JSON.parse(atob(data.content.replace(/\n/g, '')));
        loadState(state, slug);
        status.className = 'pub-status ok'; status.textContent = 'Loaded — make changes and republish.';
      } catch(err) {
        status.className = 'pub-status'; status.textContent = err.message;
      }
    })();

    // ── Init ──────────────────────────────────────────────────────────────────
    renderFeatured();
  </script>
</body>
</html>
