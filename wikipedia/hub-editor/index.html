<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hub Editor — ITSCHU.GG</title>
  <link rel="icon" href="/assets/icons/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/components/themes/theme.css?v=11" />
  <style>
    body { overflow: hidden; }
    .editor-layout { display: flex; height: calc(100vh - 48px); }

    .editor-panel {
      width: 390px; flex-shrink: 0;
      background: var(--bg-panel); border-right: var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .editor-header {
      padding: 13px 18px; border-bottom: var(--border);
      font-family: var(--font-head); font-size: 0.78rem;
      letter-spacing: 0.12em; color: var(--amber);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .editor-header-slug {
      font-size: 0.61rem; letter-spacing: 0.03em;
      color: var(--text-muted); font-family: var(--font-mono);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;
    }
    .editor-body {
      flex: 1; overflow-y: auto; padding: 14px 18px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .f-group  { display: flex; flex-direction: column; gap: 5px; }
    .f-label  { font-family: var(--font-head); font-size: 0.62rem; letter-spacing: 0.12em; color: var(--text-muted); }
    .f-input, .f-textarea {
      background: var(--bg); border: var(--border); color: var(--text);
      font-family: var(--font-mono); font-size: 0.8rem; padding: 7px 10px;
      width: 100%; box-sizing: border-box; resize: vertical;
    }
    .f-input:focus, .f-textarea:focus { outline: none; border-color: var(--amber-dim); }
    .f-textarea { min-height: 72px; }

    /* Featured article rows (reuse article-editor patterns) */
    .sec-item { background:var(--bg); border:var(--border); padding:9px; display:flex; flex-direction:column; gap:6px; }
    .sec-item-top { display:flex; align-items:center; gap:7px; }
    .sec-item-top input { flex:1; background:none; border:none; border-bottom:1px solid var(--amber-dim); color:var(--amber); font-family:var(--font-head); font-size:0.75rem; padding:3px 2px; }
    .sec-item-top input:focus { outline:none; }
    .sec-item-top input::placeholder { color:var(--text-faint); }
    .btn-remove { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.82rem; padding:0 3px; line-height:1; transition:color 0.15s; flex-shrink:0; }
    .btn-remove:hover { color:#ff5555; }
    .btn-add { align-self:flex-start; background:none; border:var(--border); color:var(--text-muted); font-family:var(--font-mono); font-size:0.7rem; padding:4px 11px; cursor:pointer; transition:color 0.15s, border-color 0.15s; }
    .btn-add:hover { color:var(--amber); border-color:var(--amber-dim); }

    .editor-footer {
      padding: 11px 18px; border-top: var(--border);
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
      background: var(--bg-panel);
    }
    .btn-publish {
      background: none; border: var(--border); color: var(--amber);
      font-family: var(--font-head); font-size: 0.78rem;
      letter-spacing: 0.1em; padding: 8px 20px; cursor: pointer;
      transition: box-shadow 0.15s, background 0.15s;
    }
    .btn-publish:hover:not(:disabled) { box-shadow: var(--glow-sm); background: var(--amber-faint); }
    .btn-publish:disabled { opacity: 0.35; cursor: not-allowed; }
    .pub-status { font-size: 0.72rem; color: var(--text-muted); flex: 1; }
    .pub-status.ok  { color: var(--amber); }
    .pub-status.err { color: #ff5555; }

    .preview-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .preview-header {
      padding: 11px 18px; border-bottom: var(--border);
      font-family: var(--font-head); font-size: 0.65rem;
      letter-spacing: 0.12em; color: var(--text-muted);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .preview-url { font-family: var(--font-mono); font-size: 0.61rem; color: var(--text-faint); }
    .preview-frame { flex: 1; border: none; background: var(--bg); width: 100%; }
  </style>
</head>
<body>
  <script src="/components/site-config.js?v=11"></script>
  <script src="/components/wiki-utils.js?v=11"></script>
  <script src="/components/navbar/inject-navbar.js?v=11" defer></script>

  <div class="editor-layout">

    <!-- Left: form -->
    <div class="editor-panel">
      <div class="editor-header">
        <span>HUB EDITOR</span>
        <span class="editor-header-slug" id="hdr-wiki"></span>
      </div>

      <div class="editor-body">

        <div class="f-group">
          <div class="f-label">WIKI</div>
          <input class="f-input" id="f-wiki" type="text" placeholder="slug (e.g. evolutionary)" autocomplete="off" spellcheck="false" />
        </div>

        <div class="f-group">
          <div class="f-label">TITLE</div>
          <input class="f-input" id="f-title" type="text" placeholder="Display name…" autocomplete="off" />
        </div>

        <div class="f-group">
          <div class="f-label">LEAD <small style="font-family:var(--font-mono);font-size:0.61rem;color:var(--text-faint);">(blank line = new paragraph)</small></div>
          <textarea class="f-textarea" id="f-lead" style="min-height:110px;" placeholder="Introductory paragraphs…"></textarea>
        </div>

        <div class="f-group">
          <div class="f-label">FEATURED ARTICLES <small style="font-family:var(--font-mono);font-size:0.61rem;color:var(--text-faint);">(stats auto-count from pages)</small></div>
          <div id="feat-list" style="display:flex;flex-direction:column;gap:8px;"></div>
          <button class="btn-add" id="feat-add">+ ADD FEATURED ARTICLE</button>
        </div>

        <div class="f-group">
          <div class="f-label">FOOTER NOTE</div>
          <input class="f-input" id="f-footer" type="text" placeholder="e.g. This wiki is under active development." />
        </div>

      </div>

      <div class="editor-footer">
        <button class="btn-publish" id="btn-pub">PUBLISH</button>
        <button class="btn-danger"  id="btn-del-wiki">DELETE WIKI</button>
        <span class="pub-status" id="pub-status"></span>
      </div>
    </div>

    <!-- Right: preview -->
    <div class="preview-panel">
      <div class="preview-header">
        <span>LIVE PREVIEW</span>
        <span class="preview-url" id="prev-url"></span>
      </div>
      <iframe class="preview-frame" id="prev-frame" sandbox="allow-same-origin allow-scripts"></iframe>
    </div>

  </div>

  <script>
    const REPO    = SITE.REPO;
    const session = SITE.getSession();
    if (!session) location.href = '/login/?returnTo=' + encodeURIComponent(location.pathname + location.search);
    const { esc, toB64 } = WIKI;

    const $ = id => document.getElementById(id);
    let uid = 0; const nid = () => ++uid;

    // ── Featured articles list ────────────────────────────────────────────────
    let featuredItems = [{ id: nid(), title: '', link: '', excerpt: '' }];

    function renderFeatured() {
      const el = $('feat-list');
      el.innerHTML = '';
      featuredItems.forEach(item => {
        const d = document.createElement('div');
        d.className = 'sec-item';
        d.innerHTML = `
          <div class="sec-item-top">
            <input type="text" placeholder="Article title…" value="${esc(item.title)}" data-id="${item.id}" data-f="title" />
            <button class="btn-remove" data-id="${item.id}">✕</button>
          </div>
          <input class="f-input" placeholder="/wikipedia/slug/article/" value="${esc(item.link)}" data-id="${item.id}" data-f="link" style="margin-top:4px;" />
          <textarea class="f-textarea" placeholder="Short excerpt…" data-id="${item.id}" data-f="excerpt" style="min-height:60px;margin-top:4px;">${esc(item.excerpt)}</textarea>`;
        d.querySelectorAll('[data-f]').forEach(i => i.addEventListener('input', e => {
          const row = featuredItems.find(x => x.id === +e.target.dataset.id);
          if (row) row[e.target.dataset.f] = e.target.value; dp();
        }));
        d.querySelector('.btn-remove').addEventListener('click', e => {
          featuredItems = featuredItems.filter(x => x.id !== +e.target.dataset.id);
          renderFeatured(); dp();
        });
        el.appendChild(d);
      });
    }
    renderFeatured();

    $('feat-add').addEventListener('click', () => {
      featuredItems.push({ id: nid(), title: '', link: '', excerpt: '' });
      renderFeatured(); dp();
    });

    // Wire text inputs to live preview
    ['f-wiki','f-title','f-lead','f-footer'].forEach(id => $(id)?.addEventListener('input', dp));

    $('f-wiki').addEventListener('input', () => {
      const slug = $('f-wiki').value.trim();
      $('hdr-wiki').textContent = slug ? '/wikipedia/'+slug+'/' : '';
      $('prev-url').textContent  = slug ? 'itschu.gg/wikipedia/'+slug+'/' : '';
      dp();
    });

    function buildState() {
      return {
        v: 1,
        title:      $('f-title').value.trim(),
        lead:       $('f-lead').value,
        featured:   featuredItems.map(f => ({ title: f.title, link: f.link, excerpt: f.excerpt })),
        footerNote: $('f-footer').value.trim(),
      };
    }

    function loadState(state, slug) {
      $('f-wiki').value         = slug;
      $('hdr-wiki').textContent = '/wikipedia/'+slug+'/';
      $('prev-url').textContent  = 'itschu.gg/wikipedia/'+slug+'/';
      $('f-title').value        = state.title  || '';
      $('f-lead').value         = state.lead   || '';
      $('f-footer').value       = state.footerNote || '';
      // Normalise featured: support old single-object and new array format
      const arr = Array.isArray(state.featured)
        ? state.featured
        : (state.featured?.title ? [state.featured] : []);
      featuredItems = arr.length
        ? arr.map(f => ({ id: nid(), title: f.title||'', link: f.link||'', excerpt: f.excerpt||'' }))
        : [{ id: nid(), title: '', link: '', excerpt: '' }];
      renderFeatured();
      dp();
    }

    // ── Live preview ──────────────────────────────────────────────────────────
    let pt = null;
    function dp() {
      clearTimeout(pt);
      pt = setTimeout(() => {
        try {
          const slug = $('f-wiki').value.trim() || 'wiki';
          // Inject <base> so /absolute/paths in srcdoc resolve to this origin
          const base = `<base href="${window.location.origin}/" />`;
          const html = WIKI.genHubHTML(buildState(), slug)
            .replace('<head>', '<head>\n  ' + base);
          $('prev-frame').srcdoc = html;
        } catch (err) {
          console.error('Hub preview failed:', err);
        }
      }, 280);
    }
    dp();

    // ── Publish ───────────────────────────────────────────────────────────────
    $('btn-pub').addEventListener('click', async () => {
      const slug   = $('f-wiki').value.trim();
      const state  = buildState();
      const btn    = $('btn-pub');
      const status = $('pub-status');

      if (!slug)        { status.className='pub-status err'; status.textContent='Wiki slug is required.'; return; }
      if (!state.title) { status.className='pub-status err'; status.textContent='Title is required.';     return; }

      btn.disabled = true;
      status.className = 'pub-status';
      status.textContent = 'Publishing…';

      const htmlPath  = `wikipedia/${slug}/index.html`;
      const statePath = `wikipedia/${slug}/hub-state.json`;
      const htmlApi   = `https://api.github.com/repos/${REPO}/contents/${htmlPath}`;
      const stateApi  = `https://api.github.com/repos/${REPO}/contents/${statePath}`;
      const html      = WIKI.genHubHTML(state, slug);
      const stateJson = JSON.stringify(state, null, 2);
      const hdrs      = { 'Authorization': `Bearer ${session.token}`, 'Accept': 'application/vnd.github+json' };

      let htmlSha = null, stateSha = null;
      try {
        const [hc, sc] = await Promise.all([fetch(htmlApi, {headers:hdrs}), fetch(stateApi, {headers:hdrs})]);
        if (hc.ok) htmlSha  = (await hc.json()).sha;
        if (sc.ok) stateSha = (await sc.json()).sha;
      } catch {}

      const hBody = { message: `wiki: update "${state.title}" hub`, content: toB64(html),      branch:'main' };
      const sBody = { message: `wiki: save hub state for "${slug}"`, content: toB64(stateJson), branch:'main' };
      if (htmlSha)  hBody.sha  = htmlSha;
      if (stateSha) sBody.sha  = stateSha;

      try {
        const [hr, sr] = await Promise.all([
          fetch(htmlApi,  { method:'PUT', headers:{...hdrs,'Content-Type':'application/json'}, body:JSON.stringify(hBody) }),
          fetch(stateApi, { method:'PUT', headers:{...hdrs,'Content-Type':'application/json'}, body:JSON.stringify(sBody) }),
        ]);
        if (hr.ok && sr.ok) {
          status.className = 'pub-status ok';
          status.textContent = `Published — live in ~60s at itschu.gg/wikipedia/${slug}/`;
        } else {
          const err = await (hr.ok ? sr : hr).json().catch(()=>({}));
          status.className = 'pub-status err';
          status.textContent = 'GitHub error: ' + (err.message || 'unknown');
        }
      } catch {
        status.className = 'pub-status err';
        status.textContent = 'Network error — try again.';
      }
      btn.disabled = false;
    });

    // ── Delete wiki ───────────────────────────────────────────────────────────
    $('btn-del-wiki').addEventListener('click', async () => {
      const slug  = $('f-wiki').value.trim();
      const title = $('f-title').value.trim() || slug;
      const status = $('pub-status');
      if (!slug) { status.className='pub-status err'; status.textContent='Enter a wiki slug first.'; return; }

      const typed = prompt(
        `This will permanently delete the "${title}" Wikipedia and remove it from the wiki list.\n\n` +
        `Article files will remain on disk but be inaccessible. ` +
        `Type "${slug}" to confirm deletion:`
      );
      if (typed === null) return; // cancelled
      if (typed !== slug) { alert('Slug did not match — deletion cancelled.'); return; }

      const btn = $('btn-del-wiki');
      btn.disabled = true;
      $('btn-pub').disabled = true;
      status.className = 'pub-status';
      status.textContent = 'Deleting…';
      try {
        await Promise.all([
          WIKI.ghDelete(`wikipedia/${slug}/index.html`,     `wiki: delete "${title}" hub`),
          WIKI.ghDelete(`wikipedia/${slug}/hub-state.json`, `wiki: delete "${title}" hub state`),
          WIKI.ghDelete(`wikipedia/${slug}/pages.json`,     `wiki: delete "${title}" pages`),
        ]);
        // Remove from wikis.json
        const wikisUrl  = `https://api.github.com/repos/${REPO}/contents/wikipedia/wikis.json`;
        const wikisResp = await fetch(wikisUrl, { headers:{'Authorization':`Bearer ${session.token}`,'Accept':'application/vnd.github+json'} });
        if (wikisResp.ok) {
          const wd    = await wikisResp.json();
          const wikis = JSON.parse(atob(wd.content.replace(/\n/g,'')));
          const body  = { message:`wiki: deregister "${title}"`, content: toB64(JSON.stringify(wikis.filter(w=>w.slug!==slug),null,2)), sha:wd.sha, branch:'main' };
          await fetch(wikisUrl, { method:'PUT', headers:{'Authorization':`Bearer ${session.token}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'}, body:JSON.stringify(body) });
        }
        status.className = 'pub-status ok';
        status.textContent = `"${title}" deleted — redirecting…`;
        setTimeout(() => location.href = '/wikipedia/', 2000);
      } catch(err) {
        status.className = 'pub-status err';
        status.textContent = 'Delete failed: ' + err.message;
        btn.disabled = false; $('btn-pub').disabled = false;
      }
    });

    // ── Load on ?wiki= ────────────────────────────────────────────────────────
    (async () => {
      const slug = new URLSearchParams(location.search).get('wiki');
      if (!slug || !session) return;
      const status = $('pub-status');
      status.className = 'pub-status';
      status.textContent = 'Loading…';
      try {
        const api  = `https://api.github.com/repos/${REPO}/contents/wikipedia/${slug}/hub-state.json`;
        const resp = await fetch(api, { headers: { 'Authorization': `Bearer ${session.token}`, 'Accept': 'application/vnd.github+json' } });
        if (!resp.ok) throw new Error('No hub state found — fill in the form and publish to create one.');
        const data  = await resp.json();
        const state = JSON.parse(atob(data.content.replace(/\n/g, '')));
        loadState(state, slug);
        status.className = 'pub-status ok';
        status.textContent = 'Loaded — make changes and republish.';
      } catch(err) {
        // Pre-fill the slug at least
        $('f-wiki').value = slug;
        $('hdr-wiki').textContent = '/wikipedia/'+slug+'/';
        $('prev-url').textContent  = 'itschu.gg/wikipedia/'+slug+'/';
        dp();
        status.className = 'pub-status';
        status.textContent = err.message;
      }
    })();
  </script>
</body>
</html>
