<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wikipedia — ITSCHU.GG</title>
  <link rel="icon" href="/assets/icons/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/components/themes/theme.css?v=11" />
  <style>
    .wiki-hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 6px;
    }
    .wiki-hub-card {
      display: block;
      background: var(--bg-panel);
      border: var(--border);
      padding: 22px 20px 20px;
      min-height: 140px;
      text-decoration: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      position: relative;
    }
    .wiki-hub-card:hover {
      border-color: var(--amber);
      box-shadow: var(--glow-md);
      background: var(--bg-hover);
    }
    .wiki-hub-card-name {
      font-family: var(--font-head);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--amber);
      text-shadow: var(--glow-sm);
      margin-bottom: 10px;
    }
    .wiki-hub-card-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .wiki-hub-card.create {
      border-style: dashed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
    }
    .wiki-hub-card.create .wiki-hub-card-name {
      color: var(--text-muted);
      font-size: 1.4rem;
      letter-spacing: 0;
      margin-bottom: 6px;
    }
    .wiki-hub-card.create .wiki-hub-card-desc { font-size: 0.72rem; }
    .wiki-hub-card.create:hover .wiki-hub-card-name { color: var(--amber); }
  </style>
</head>
<body>
  <script src="/components/navbar/inject-navbar.js?v=3" defer></script>

  <div class="page-wrapper">
    <div class="panel">
      <div class="panel-label">WIKIS</div>
      <div class="wiki-hub-grid" id="wiki-grid">
        <!-- Cards injected by JS -->
      </div>
    </div>
  </div>

  <script>
    const ALLOWED = ['ItsChugg', 'zmbprotocol'];

    function getSession() {
      try {
        const s = JSON.parse(localStorage.getItem('wiki_session') || 'null');
        if (!s || Date.now() > s.expires) return null;
        return s;
      } catch { return null; }
    }

    fetch('/wikipedia/wikis.json')
      .then(r => r.json())
      .then(wikis => {
        const grid    = document.getElementById('wiki-grid');
        const session = getSession();

        wikis.forEach(w => {
          const a = document.createElement('a');
          a.className = 'wiki-hub-card';
          a.href      = '/wikipedia/' + w.slug + '/';
          a.innerHTML = `<div class="wiki-hub-card-name">${w.name}</div>
                         <div class="wiki-hub-card-desc">${w.description}</div>`;
          grid.appendChild(a);
        });

        // Show "Create new Wikipedia" card for authorised users
        if (session && ALLOWED.includes(session.username)) {
          const btn = document.createElement('a');
          btn.className = 'wiki-hub-card create';
          btn.href      = '/wikipedia/new/';
          btn.innerHTML = `<div class="wiki-hub-card-name">+</div>
                           <div class="wiki-hub-card-desc">Create a new Wikipedia</div>`;
          grid.appendChild(btn);
        }
      })
      .catch(() => {
        document.getElementById('wiki-grid').innerHTML =
          '<p style="color:var(--text-muted);font-size:0.8rem;">Could not load wikis.</p>';
      });
  </script>
</body>
</html>
