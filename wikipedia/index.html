<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wikipedia — ITSCHU.GG</title>
  <link rel="icon" href="/assets/icons/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/components/themes/theme.css?v=27" />
</head>
<body>
  <script src="/components/site-config.js?v=27"></script>
  <script src="/components/navbar/inject-navbar.js?v=27" defer></script>

  <div class="page-wrapper">
    <div class="panel">
      <div class="panel-label">WIKIPEDIAS</div>
      <div class="wiki-hub-grid" id="wiki-grid">
        <!-- Cards injected by JS -->
      </div>
    </div>
  </div>

  <script src="/components/wiki-utils.js?v=27"></script>
  <script>
    WIKI.renderWikiGrid('wiki-grid');
    // Show audit button for authorised users
    const _s = SITE.getSession();
    if (_s && SITE.ALLOWED.includes(_s.username)) {
      const _btn = document.createElement('a');
      _btn.href      = '/wikipedia/audit/';
      _btn.className = 'wiki-edit-btn';
      _btn.textContent = '⚑ LINK AUDIT';
      document.body.appendChild(_btn);
    }
  </script>
</body>
</html>
