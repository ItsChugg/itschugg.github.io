<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account — ITSCHU.GG</title>
  <link rel="icon" href="/assets/icons/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/components/themes/theme.css?v=31" />
  <style>
    .acct-wrap {
      max-width: 520px;
      margin: 72px auto;
      padding: 0 16px;
    }
    .acct-box {
      background: var(--bg-panel);
      border: var(--border);
    }
    .acct-header {
      padding: 14px 24px;
      border-bottom: var(--border);
      font-family: var(--font-head);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      color: var(--amber);
    }
    .acct-body {
      padding: 28px 24px;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .acct-avatar {
      width: 72px;
      height: 72px;
      border: var(--border);
      flex-shrink: 0;
    }
    .acct-info { flex: 1; }
    .acct-name {
      font-family: var(--font-head);
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      color: var(--amber);
      margin-bottom: 6px;
    }
    .acct-detail {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.9;
    }
    .acct-detail a {
      color: var(--text-muted);
      text-decoration: underline;
    }
    .acct-detail a:hover { color: var(--amber); }
    .acct-footer {
      padding: 16px 24px;
      border-top: var(--border);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-action {
      display: inline-block;
      background: none;
      border: var(--border);
      color: var(--text);
      font-family: var(--font-head);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      padding: 8px 18px;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .btn-action:hover {
      color: var(--amber);
      border-color: var(--amber-dim);
      box-shadow: var(--glow-sm);
    }
    .btn-action.muted { color: var(--text-muted); }
    .btn-action.muted:hover { color: #ff5555; border-color: rgba(255,85,85,0.3); box-shadow: none; }
  </style>
</head>
<body>
  <script src="/components/site-config.js?v=31"></script>
  <script src="/components/navbar/inject-navbar.js?v=31" defer></script>

  <div class="acct-wrap">
    <div class="acct-box">
      <div class="acct-header">ACCOUNT</div>
      <div class="acct-body">
        <img class="acct-avatar" id="acct-avatar" src="" alt="avatar" />
        <div class="acct-info">
          <div class="acct-name" id="acct-name"></div>
          <div class="acct-detail" id="acct-detail"></div>
        </div>
      </div>
      <div class="acct-footer">
        <a class="btn-action" href="/wikipedia/editor/?wiki=evolutionary">WIKI EDITOR</a>
        <a class="btn-action" href="/" >HOME</a>
        <button class="btn-action muted" id="signout-btn">SIGN OUT</button>
      </div>
    </div>
  </div>

  <script>
    const session = SITE.getSession();
    if (!session) {
      location.href = '/login/?returnTo=/account/';
    } else {
      document.getElementById('acct-avatar').src = session.avatar;
      document.getElementById('acct-name').textContent  = session.username;

      const expires = new Date(session.expires);
      const ghUrl   = `https://github.com/${session.username}`;
      document.getElementById('acct-detail').innerHTML =
        `GitHub: <a href="${ghUrl}" target="_blank" rel="noopener">${session.username}</a><br>` +
        `Session expires: ${expires.toLocaleString()}<br>` +
        `Role: Contributor`;
    }

    document.getElementById('signout-btn').addEventListener('click', () => {
      localStorage.removeItem('wiki_session');
      location.href = '/';
    });
  </script>
</body>
</html>
