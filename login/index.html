<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ITSCHU.GG</title>
  <link rel="icon" href="/assets/icons/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/components/themes/theme.css?v=4" />
  <style>
    .login-wrap {
      max-width: 480px;
      margin: 80px auto;
      padding: 0 16px;
    }
    .login-box {
      background: var(--bg-panel);
      border: var(--border);
      padding: 40px 40px 36px;
      text-align: center;
    }
    .login-title {
      font-family: var(--font-head);
      color: var(--amber);
      font-size: 1.3rem;
      letter-spacing: 0.12em;
      margin-bottom: 10px;
    }
    .login-sub {
      color: var(--text-muted);
      font-size: 0.82rem;
      line-height: 1.8;
      margin-bottom: 32px;
    }
    .login-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: var(--border);
      color: var(--text);
      font-family: var(--font-head);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      padding: 12px 28px;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .login-btn:hover {
      color: var(--amber);
      border-color: var(--amber-dim);
      box-shadow: var(--glow-sm);
    }
    .login-btn svg { fill: currentColor; width: 18px; height: 18px; flex-shrink: 0; }

    /* Already logged in state */
    #login-already { display: none; }
    .login-avatar {
      width: 56px;
      height: 56px;
      border: var(--border);
      margin-bottom: 14px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .login-username {
      font-family: var(--font-head);
      color: var(--amber);
      font-size: 1rem;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .login-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .btn-ghost {
      background: none;
      border: var(--border);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      padding: 9px 20px;
      cursor: pointer;
      transition: color 0.15s;
    }
    .btn-ghost:hover { color: var(--amber); }
  </style>
</head>
<body>

  <script src="/components/site-config.js?v=4"></script>
  <script src="/components/navbar/inject-navbar.js?v=4" defer></script>

  <div class="login-wrap">
    <div class="login-box">

      <!-- Not logged in -->
      <div id="login-new">
        <div class="login-title">> AUTHENTICATE</div>
        <div class="login-sub">
          Sign in with GitHub to create and edit<br>
          pages in the Evolutionary wiki.
        </div>
        <button class="login-btn" id="gh-login-btn">
          <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
              0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
              -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
              .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
              -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
              1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
              1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
              1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          SIGN IN WITH GITHUB
        </button>
      </div>

      <!-- Already logged in -->
      <div id="login-already">
        <img class="login-avatar" id="login-avatar" src="" alt="avatar" />
        <div class="login-username" id="login-username"></div>
        <div class="login-sub" style="margin-bottom:0">You are signed in.</div>
        <div class="login-actions">
          <a href="/wikipedia/editor/?wiki=evolutionary" class="login-btn">GO TO EDITOR</a>
          <button class="btn-ghost" id="logout-btn">SIGN OUT</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const CLIENT_ID  = 'Ov23liF1e2Cd1FyTgq7I';
    const SCOPE      = 'public_repo';

    const session = SITE.getSession();
    if (session) {
      // Already logged in — send to account page
      location.replace('/account/');
    }

    document.getElementById('gh-login-btn').addEventListener('click', () => {
      const returnTo = new URLSearchParams(location.search).get('returnTo') || '/account/';
      const state    = btoa(JSON.stringify({ nonce: crypto.randomUUID(), returnTo }));
      sessionStorage.setItem('oauth_state', state);
      location.href  = `https://github.com/login/oauth/authorize?client_id=${CLIENT_ID}&scope=${SCOPE}&state=${encodeURIComponent(state)}`;
    });

    document.getElementById('logout-btn')?.addEventListener('click', () => {
      localStorage.removeItem('wiki_session');
      location.reload();
    });
  </script>

</body>
</html>
